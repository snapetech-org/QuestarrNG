manifestVersion: 1
id: doezer-questarr
category: media
name: QuestarrNG
version: "1.11.0"
tagline: Discover, track and download your video games
description: >-
  Questarr is a video game management application inspired by the *Arr apps (Sonarr, Radarr,
  Prowlarr).


  Track your collection with status indicators, discover new releases through IGDB, RSS feeds and
  xREL, sync your Steam wishlist, search your Torznab/Newznab indexers, and send releases straight to
  qBittorrent, Transmission, rTorrent, Deluge, Synology Download Station, SABnzbd or NZBGet.


  Questarr stores everything in a self-contained SQLite database. To let it import finished
  downloads, mount the same root your download client writes into and add a matching entry under
  Settings -> Path Mappings.
releaseNotes: >-
  See https://github.com/snapetech-org/QuestarrNG/releases for the full changelog.
