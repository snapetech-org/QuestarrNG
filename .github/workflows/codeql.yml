# ng-runner-policy: private-jit-only-v1
name: CodeQL

on:
  push:
    tags: [v*]
  workflow_dispatch:

concurrency:
  group: ng-scan-codeql-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-questarrng","ng-main-run-{0}"]}}', github.run_id)) }}
    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        # Explicit language list keeps analysis aligned with source in the repo.
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
          - language: cpp
            build-mode: manual

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10 SDK
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/questarrng-codeql-dotnet-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          dotnet-version: '10.0.402'

      - name: Setup Node.js 22.x
        if: matrix.language == 'javascript-typescript' || matrix.language == 'cpp'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          package-manager-cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Restore C# service dependencies
        if: matrix.language == 'csharp'
        run: dotnet restore installer/windows/Questarr.Service/Questarr.Service.csproj --runtime win-x64 --locked-mode

      - name: Build C# service for CodeQL
        if: matrix.language == 'csharp'
        run: dotnet build installer/windows/Questarr.Service/Questarr.Service.csproj --configuration Release --no-restore --runtime win-x64

      - name: Build Home Assistant ownership helper for CodeQL
        if: matrix.language == 'cpp'
        run: cc -std=c11 -Wall -Wextra -Werror -o "$RUNNER_TEMP/questarr-fix-data-owner" questarr/fix-data-owner.c

      - name: Run Home Assistant ownership helper sanitizers
        if: matrix.language == 'cpp'
        env:
          REQUIRE_SANITIZER_TOOLCHAIN: "1"
          LD_PRELOAD: ""
        run: node --test tests/contracts/home-assistant-data-owner-sanitizers.contract.mjs

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"

