# ng-runner-policy: private-jit-only-v1
# Dependency Review Action
#
# Automatic pull-request checks are disabled; manual dispatch is a no-op until
# the reviewed release-tag validation flow invokes dependency scanning.
#
# Source repository: https://github.com/actions/dependency-review-action
name: "Dependency Review"
on:
  workflow_dispatch: {}
concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-questarrng","ng-main-run-{0}","gha-{0}-dependency-review"]}}', github.run_id)) }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Dependency Review"
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
