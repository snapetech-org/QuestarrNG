# ng-runner-policy: hosted-compatible-v1
name: Dependency Submission

on:
  push:
    branches:
      - main
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '**/npm-shrinkwrap.json'
      - '**/*.csproj'
      - '**/*.fsproj'
      - '**/*.vbproj'
      - '**/*.sln'
      - '**/packages.lock.json'
      - '**/packages.config'
      - '**/NuGet.Config'
      - '**/nuget.config'
      - '**/Directory.Packages.props'
      - '**/Directory.Build.props'
      - '**/Directory.Build.targets'
      - '**/Directory.Packages.targets'
      - '**/global.json'
      - '.github/workflows/dependency-submission.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit-dependencies:
    if: github.ref == 'refs/heads/main'
    name: Submit NuGet and npm dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Audit outbound calls
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check out the trusted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Submit NuGet and npm dependency snapshots
        uses: advanced-security/component-detection-dependency-submission-action@a02aeda7a175ad4dd38a13c4d3ff2df9da8f2cf0 # v0.2.0
        with:
          filePath: .
          detectorsCategories: NuGet,Npm
          snapshot-sha: ${{ github.sha }}
          snapshot-ref: ${{ github.ref }}
