# ng-runner-policy: private-jit-only-v1
name: Deprecated Dependencies


run-name: >-
  ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
      format('action:ci:pool:private:tag:{0}', github.ref_name) ||
      github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/') &&
      format('action:{0}:pool:{1}:tag:{2}', inputs.action || 'ci', inputs.runner_pool || 'private', github.ref_name) ||
      github.event_name == 'workflow_dispatch' &&
      format('action:{0}:pool:{1}', inputs.action || 'ci', inputs.runner_pool || 'private') || format('action:ci:pool:private') }}
on:
  workflow_dispatch:
    inputs:
      action:
        description: Required manual workflow action
        type: choice
        options: [ci]
        required: true
      runner_pool:
        description: Required private JIT runner pool
        type: choice
        options: [private]
        required: true


concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-deprecated:
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'ci' &&
          inputs.runner_pool == 'private'
        )
      ) &&
      (
        true
      )
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-questarrng","ng-main-run-{0}","gha-{0}-check-deprecated"]}}', github.run_id)) }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 26.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: "npm"

      # check-deprecated-deps.mjs only reads the lockfile plus `npm view`/`npm ls`; no native
      # modules need building, so lifecycle scripts are skipped here.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Fails if a deprecated dependency (direct or transitive) now has a non-deprecated
      # newer version available. See scripts/check-deprecated-deps.mjs for what this can
      # and can't detect.
      - name: Check for actionable deprecated dependencies
        run: npm run check:deprecated
