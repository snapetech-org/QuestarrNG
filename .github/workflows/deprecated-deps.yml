# ng-runner-policy: private-jit-only-v1
name: Deprecated Dependencies

on:
  workflow_dispatch:

  push:
    tags:
      - '**'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-deprecated:
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-questarrng","ng-main-run-{0}","gha-{0}-check-deprecated"]}}', github.run_id)) }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 26.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: "npm"

      # check-deprecated-deps.mjs only reads the lockfile plus `npm view`/`npm ls`; no native
      # modules need building, so lifecycle scripts are skipped here.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Fails if a deprecated dependency (direct or transitive) now has a non-deprecated
      # newer version available. See scripts/check-deprecated-deps.mjs for what this can
      # and can't detect.
      - name: Check for actionable deprecated dependencies
        run: npm run check:deprecated
