# ng-runner-policy: hosted-first-v1
name: CI
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number != '' &&
      format('owner-pr:{0}:{1}:{2}', inputs.pr_number, inputs.pr_sha, inputs.target_run_id) || github.workflow }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, release/*]
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  # Allow manual trigger
  workflow_dispatch:
    inputs:

# Keep each run's result attached to its exact candidate; newer pushes must not
# cancel builds already in progress.
      pr_number:
        description: Trusted owner PR number (set only by the metadata dispatcher)
        required: false
        type: string
      pr_sha:
        description: Exact owner PR head SHA
        required: false
        type: string
      target_run_id:
        description: Successful metadata-only pull_request_target run ID
        required: false
        type: string
concurrency:
  group: ng-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.action == 'edited' && 'metadata' || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

permissions:
  contents: read

jobs:
  release-notes:
    name: Release-note contract
    if: >-
      (github.event_name != 'pull_request_target' &&
      (github.event_name != 'pull_request' || github.actor != 'snapetech' ||
       github.event.pull_request.user.login != 'snapetech' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       github.event.pull_request.head.repo.id != github.repository_id ||
       github.event.pull_request.base.ref != 'main') &&
      (github.event_name != 'workflow_dispatch' ||
       (inputs.pr_number == '' && inputs.pr_sha == '' && inputs.target_run_id == ''))) && (github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot')
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-questarrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}
    permissions:
      contents: read

    steps:
      - name: Checkout history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          package-manager-cache: false

      - name: Validate release-note fragment or explicit opt-out
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/pr-body.md"
          printf '%s' "$PR_BODY" > "$body_file"
          node scripts/check-release-notes.mjs \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --pr-body "$body_file" \
            --summary-file "$GITHUB_STEP_SUMMARY"

  # Dependency and secret hygiene, in one job so `npm ci` runs once instead of three times.
  # None of these steps needs native modules built, so lifecycle scripts (arbitrary code
  # from transitive deps) are skipped.
  sca-scan:
    if: >-
      ((github.event_name == 'workflow_dispatch' &&
      (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') &&
      inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' &&
      github.ref == 'refs/heads/main')) || ((github.event_name != 'pull_request_target' &&
      (github.event_name != 'pull_request' || github.actor != 'snapetech' ||
       github.event.pull_request.user.login != 'snapetech' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       github.event.pull_request.head.repo.id != github.repository_id ||
       github.event.pull_request.base.ref != 'main') &&
      (github.event_name != 'workflow_dispatch' ||
       (inputs.pr_number == '' && inputs.pr_sha == '' && inputs.target_run_id == ''))))
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-questarrng","ng-main-run-{0}","gha-{0}-sca-scan"]}}', github.run_id)) || (!(github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') && ((vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-questarrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest')) }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docker: ${{ steps.docker_changes.outputs.docker }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # secretlint requires Node >=22
          ref: ${{ inputs.pr_sha != '' && inputs.pr_sha || (github.sha) }}
      - name: Setup Node.js 26.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: ${{ inputs.pr_number == '' }}
          node-version: 26.x
          # GitHub scopes the Actions cache per-branch (a pull_request run cannot write
          # into the cache that push/main runs restore from), and every `npm ci` in this
          # workflow runs with --ignore-scripts, so a compromised dependency cannot run
          # install/postinstall code to tamper with the cache before it's saved. This repo
          # has a single maintainer with push access, so cache-poisoning here is accepted
          # as a low, non-actionable risk instead of splitting cache restore/save by trust.
          cache: ${{ inputs.pr_number == '' && 'npm' || '' }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Scan for secrets
        run: npm run secretlint

      # Fails if a package.json "overrides" entry (see docs/DEPENDENCIES.md) has become
      # redundant, i.e. every consumer now declares a range that's already safe on its own.
      - name: Check for stale dependency overrides
        run: npm run check:overrides

      # Policy: docs/VULNERABILITY_MANAGEMENT.md §1.3 — Critical/High findings
      # in any direct or transitive dependency block merge/release.
      - name: Audit all dependencies (Critical/High blocks build)
        run: npm audit --audit-level=high

      # Policy: docs/VULNERABILITY_MANAGEMENT.md §1.4 — production dependency
      # licenses must be on the allow-list.
      - name: Check dependency licenses
        run: npm run check:licenses

      # The image build is expensive; inspect the live PR files for normal PRs and the
      # exact claimed PR for the isolated owner-dispatch run. API failures run the check.
      - name: Detect changes that affect the Docker image
        id: docker_changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number != '' && inputs.pr_number || github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from urllib.request import Request, urlopen

          repo = os.environ['REPOSITORY']
          number = os.environ['PR_NUMBER']
          token = os.environ['GH_TOKEN']
          run_docker = True

          if repo.lower() == 'snapetech-org/questarrng' and re.fullmatch(r'[1-9][0-9]*', number or ''):
              def api(path):
                  request = Request(
                      f'https://api.github.com/repos/{repo}/{path}',
                      headers={
                          'Accept': 'application/vnd.github+json',
                          'Authorization': f'Bearer {token}',
                          'X-GitHub-Api-Version': '2022-11-28',
                      },
                  )
                  with urlopen(request, timeout=20) as response:
                      return json.load(response)

              try:
                  pr = api(f'pulls/{number}')
                  changed_count = int(pr.get('changed_files', 0))
                  if changed_count <= 3000:
                      changed = []
                      for page in range(1, (changed_count + 99) // 100 + 1):
                          changed.extend(api(f'pulls/{number}/files?per_page=100&page={page}'))
                      if len(changed) == changed_count:
                          image_path = re.compile(
                              r'^(Dockerfile|\.dockerignore|entrypoint\.sh|'
                              r'package(-lock)?\.json|requirements/|migrations(-pg)?/|'
                              r'\.github/workflows/ci\.yml$)'
                          )
                          run_docker = any(image_path.search(item.get('filename', '')) for item in changed)
              except Exception:
                  print('PR file lookup failed; running Docker validation')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'docker={str(run_docker).lower()}\n')
          PY

  windows-service:
    if: >-
      ((github.event_name == 'workflow_dispatch' &&
      (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') &&
      inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' &&
      github.ref == 'refs/heads/main')) || ((github.event_name != 'pull_request_target' &&
      (github.event_name != 'pull_request' || github.actor != 'snapetech' ||
       github.event.pull_request.user.login != 'snapetech' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       github.event.pull_request.head.repo.id != github.repository_id ||
       github.event.pull_request.base.ref != 'main') &&
      (github.event_name != 'workflow_dispatch' ||
       (inputs.pr_number == '' && inputs.pr_sha == '' && inputs.target_run_id == ''))))
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-questarrng","ng-main-run-{0}","gha-{0}-windows-service"]}}', github.run_id)) || (!(github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') && ((vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-questarrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest')) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

          ref: ${{ inputs.pr_sha != '' && inputs.pr_sha || (github.sha) }}
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/questarrng-dotnet-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          dotnet-version: '10.0.402'

      - name: Verify selected .NET SDK
        run: '"$RUNNER_TEMP/questarrng-dotnet-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/dotnet" --version'

      - name: Restore locked Windows service dependencies
        run: >-
          "$RUNNER_TEMP/questarrng-dotnet-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/dotnet" restore
          installer/windows/Questarr.Service/Questarr.Service.csproj
          --runtime win-x64
          --locked-mode

      - name: Publish self-contained Windows service host
        run: >-
          "$RUNNER_TEMP/questarrng-dotnet-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/dotnet" publish
          installer/windows/Questarr.Service/Questarr.Service.csproj
          --configuration Release
          --no-restore
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          --output ./artifacts/windows-service

      - name: Verify published service executable
        run: test -s ./artifacts/windows-service/Questarr.Service.exe

      - name: Clean up temporary .NET SDK
        if: always()
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/questarrng-dotnet-${{ github.run_id }}-${{ github.run_attempt }}
        run: rm -rf -- "$DOTNET_INSTALL_DIR"

  # Pull requests run app tests on GitHub-hosted runners; only trusted main runs
  # use the isolated shared runner pool.
  test:
    if: >-
      ((github.event_name == 'workflow_dispatch' &&
      (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') &&
      inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' &&
      github.ref == 'refs/heads/main')) || ((github.event_name != 'pull_request_target' &&
      (github.event_name != 'pull_request' || github.actor != 'snapetech' ||
       github.event.pull_request.user.login != 'snapetech' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       github.event.pull_request.head.repo.id != github.repository_id ||
       github.event.pull_request.base.ref != 'main') &&
      (github.event_name != 'workflow_dispatch' ||
       (inputs.pr_number == '' && inputs.pr_sha == '' && inputs.target_run_id == ''))))
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-questarrng","ng-main-run-{0}","gha-{0}-test"]}}', github.run_id)) || (!(github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') && ((vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-questarrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-24.04')) }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

          ref: ${{ inputs.pr_sha != '' && inputs.pr_sha || (github.sha) }}
      - name: Setup Node.js 26.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/questarrng-npm-cache
        with:
          package-manager-cache: ${{ inputs.pr_number == '' }}
          node-version: 26.x
          cache: ${{ inputs.pr_number == '' && 'npm' || '' }}

      - name: Install locked JavaScript dependencies
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/questarrng-npm-cache
          NODE_USE_ENV_PROXY: '1'
        run: npm ci --ignore-scripts

      - name: Run Vitest coverage suite
        env:
          QUESTARR_CI_VITEST_MAX_WORKERS: "4"
        run: >-
          npm run test:coverage --
          --reporter=default
          --reporter=junit
          --outputFile.junit=test-report.junit.xml

      # Playwright runs in e2e.yml after its isolated test server starts.

      - name: Collect reports for diagnostics and Codecov
        if: always()
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/quest-codecov-reports"
          mkdir -p "$report_dir"
          if [ -d coverage ]; then cp -a coverage "$report_dir/"; fi
          if [ -f test-report.junit.xml ]; then cp -a test-report.junit.xml "$report_dir/"; fi

      - name: Upload pull-request reports for diagnosis
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quest-codecov-reports
          if-no-files-found: warn
          retention-days: 3

      - name: Upload Codecov reports for the trusted workflow
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codecov-reports-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quest-codecov-reports
          if-no-files-found: warn
          retention-days: 1

  build:
    if: >-
      ((github.event_name == 'workflow_dispatch' &&
      (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') &&
      inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' &&
      github.ref == 'refs/heads/main')) || ((github.event_name != 'pull_request_target' &&
      (github.event_name != 'pull_request' || github.actor != 'snapetech' ||
       github.event.pull_request.user.login != 'snapetech' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       github.event.pull_request.head.repo.id != github.repository_id ||
       github.event.pull_request.base.ref != 'main') &&
      (github.event_name != 'workflow_dispatch' ||
       (inputs.pr_number == '' && inputs.pr_sha == '' && inputs.target_run_id == ''))))
    name: Build and check on Node ${{ matrix.node-version }}
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') && ((matrix.node-version == '22.23.4' && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-questarrng","ng-main-run-{0}","gha-{0}-build-node-22"]}}', github.run_id))) || (matrix.node-version == '26.x' && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-questarrng","ng-main-run-{0}","gha-{0}-build-node-26"]}}', github.run_id)))) || (!(github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') && ((vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-questarrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-24.04')) }}
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(github.event_name == 'pull_request' && '["22.23.4"]' || '["22.23.4", "26.x"]') }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

          ref: ${{ inputs.pr_sha != '' && inputs.pr_sha || (github.sha) }}
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/questarrng-npm-cache
        with:
          package-manager-cache: ${{ inputs.pr_number == '' }}
          node-version: ${{ matrix.node-version }}
          cache: ${{ inputs.pr_number == '' && 'npm' || '' }}

      - name: Install locked JavaScript dependencies
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/questarrng-npm-cache
          NODE_USE_ENV_PROXY: '1'
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Build production assets
        run: npm run build

      - name: Verify production build output
        run: test -d dist

  docker-build:
    env:
      BUILDKIT_EGRESS_PROXY: ${{ ((github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') || ((vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))))) && 'http://10.0.2.100:3128' || '' }}
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-questarrng","ng-main-run-{0}","gha-{0}-docker-build"]}}', github.run_id)) || (!(github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') && ((vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-questarrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest')) }}
    needs: [sca-scan, build, test]
    if: >-
      ((github.event_name == 'workflow_dispatch' &&
      (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') &&
      inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' &&
      github.ref == 'refs/heads/main')) || ((github.event_name != 'pull_request_target' &&
      (github.event_name != 'pull_request' || github.actor != 'snapetech' ||
       github.event.pull_request.user.login != 'snapetech' ||
       github.event.pull_request.head.repo.full_name != github.repository ||
       github.event.pull_request.head.repo.id != github.repository_id ||
       github.event.pull_request.base.ref != 'main') &&
      (github.event_name != 'workflow_dispatch' ||
       (inputs.pr_number == '' && inputs.pr_sha == '' && inputs.target_run_id == ''))) && (needs.sca-scan.outputs.docker == 'true'))
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
          allowed-endpoints: >
            pypi.org:443
            files.pythonhosted.org:443
            www.rarlab.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

          ref: ${{ inputs.pr_sha != '' && inputs.pr_sha || (github.sha) }}
      - name: Pre-pull BuildKit image
        run: |
          for i in {1..5}; do
            docker pull moby/buildkit:buildx-stable-1 && break
            echo "Pull failed, retrying in 5 seconds..."
            sleep 5
          done

      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@e50058a0fcd8d1a7d626c905502d010a468bf238 # v4.4.1
        with:
          # The isolated BuildKit daemon needs the runner's trust roots too.
          buildkitd-config-inline: |
            [registry."docker.io"]
              ca = ["/etc/ssl/certs/ca-certificates.crt"]
          driver-opts: |
            env.HTTP_PROXY=${{ env.BUILDKIT_EGRESS_PROXY }}
            env.HTTPS_PROXY=${{ env.BUILDKIT_EGRESS_PROXY }}
            env.http_proxy=${{ env.BUILDKIT_EGRESS_PROXY }}
            env.https_proxy=${{ env.BUILDKIT_EGRESS_PROXY }}
            env.SSL_CERT_FILE=/etc/buildkit/certs/docker.io/ca-certificates.crt
      - name: Build Docker image
        uses: step-security/docker-build-push-action@b736dc8a921e02a288f956d3dd9111e276a4cfec # v7.4.0
        with:
          context: .
          push: false
          tags: questarr:test
          build-args: |
            HTTP_PROXY=${{ env.BUILDKIT_EGRESS_PROXY }}
            HTTPS_PROXY=${{ env.BUILDKIT_EGRESS_PROXY }}
            http_proxy=${{ env.BUILDKIT_EGRESS_PROXY }}
            https_proxy=${{ env.BUILDKIT_EGRESS_PROXY }}
            NO_PROXY=localhost,127.0.0.1
            no_proxy=localhost,127.0.0.1
          cache-from: ${{ inputs.pr_number == '' && 'type=gha' || '' }}
          cache-to: ${{ inputs.pr_number == '' && 'type=gha,mode=max' || '' }}
          load: true

      - name: Verify Docker image
        run: |
          echo "Docker image built successfully"
          docker images | grep questarr || echo "Image not found in docker images, but build completed"

  dispatch-owner-pr:
    name: Dispatch trusted owner PR validation
    if: >-
      github.event_name == 'pull_request_target' &&
      github.actor == 'snapetech' &&
      github.event.pull_request.user.login == 'snapetech' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.repo.id == github.repository_id &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ${{ (github.event_name == 'pull_request_target' && github.actor == 'snapetech' && github.event.pull_request.user.login == 'snapetech' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.repo.id == github.repository_id && github.event.pull_request.base.ref == 'main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-questarrng","ng-main-run-{0}","gha-{0}-owner-pr-dispatcher"]}}', github.run_id)) }}
    permissions:
      actions: write
      contents: none
    steps:
      - name: Dispatch PR-head validation from main
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          TARGET_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json,os,re
          from urllib.request import Request,urlopen
          expected='snapetech-org/QuestarrNG'
          repository=os.environ['GITHUB_REPOSITORY'];number=os.environ['PR_NUMBER'];sha=os.environ['PR_SHA'].lower();target=os.environ['TARGET_RUN_ID'];token=os.environ['GH_TOKEN']
          if repository.lower()!=expected.lower() or not re.fullmatch(r'[1-9][0-9]*',number) or not re.fullmatch(r'[0-9a-f]{40}',sha) or not re.fullmatch(r'[1-9][0-9]*',target):raise SystemExit('invalid PR claim')
          payload=json.dumps({"ref": "main", "inputs": {"pr_number": number, "pr_sha": sha, "target_run_id": target}}).encode()
          request=Request(
            'https://api.github.com/repos/snapetech-org/QuestarrNG/actions/workflows/ci.yml/dispatches',
            data=payload,headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='POST')
          with urlopen(request,timeout=20) as response:
            if response.status!=204:raise SystemExit(f'dispatch HTTP {response.status}')
          PY

  report-owner-pr-check:
    name: Report trusted owner PR validation
    needs: [sca-scan, windows-service, test, build, docker-build]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') &&
      inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' &&
      github.ref == 'refs/heads/main'
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && (github.actor == 'snapetech' || github.actor == 'github-actions[bot]') && inputs.pr_number != '' && inputs.pr_sha != '' && inputs.target_run_id != '' && github.ref == 'refs/heads/main') && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-questarrng","ng-main-run-{0}","gha-{0}-owner-pr-reporter"]}}', github.run_id)) }}
    permissions:
      checks: write
      contents: none
    steps:
      - name: Attach validation result to the PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_SHA: ${{ inputs.pr_sha }}
          VALIDATION_RUN_ID: ${{ github.run_id }}
          VALIDATION_RESULTS: '{"sca-scan":"${{ needs.sca-scan.result }}","windows-service":"${{ needs.windows-service.result }}","test":"${{ needs.test.result }}","build":"${{ needs.build.result }}","docker-build":"${{ needs.docker-build.result }}"}'
        run: |
          python3 - <<'PY'
          import json,os,re
          from urllib.request import Request,urlopen
          number=os.environ['PR_NUMBER'];sha=os.environ['PR_SHA'].lower();results=json.loads(os.environ['VALIDATION_RESULTS'])
          if not re.fullmatch(r'[1-9][0-9]*',number) or not re.fullmatch(r'[0-9a-f]{40}',sha) or not results:raise SystemExit('invalid PR check claim')
          conclusion='success' if all(v=='success' for v in results.values()) else 'failure'
          summary='Main-pinned, no-secret owner PR validation:\n'+'\n'.join(f'- {n}: {v}' for n,v in results.items())
          run_id=os.environ['VALIDATION_RUN_ID']
          payload=json.dumps({"name": "QuestarrNG owner PR validation", "head_sha": sha, "external_id": run_id, "status": "completed", "conclusion": conclusion, "details_url": "https://github.com/snapetech-org/QuestarrNG/actions/runs/" + run_id, "output": {"title": "Owner PR validation " + conclusion, "summary": summary}}).encode()
          request=Request('https://api.github.com/repos/snapetech-org/QuestarrNG/check-runs',data=payload,headers={'Accept':'application/vnd.github+json','Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'},method='POST')
          with urlopen(request,timeout=20) as response:
            if response.status not in {201,202}:raise SystemExit(f'check HTTP {response.status}')
          PY
