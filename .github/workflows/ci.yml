name: CI

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main, release/*]
  # Allow manual trigger
  workflow_dispatch:

# Only the newest commit of a PR or branch is worth testing: a new push cancels the
# run still going for the previous one, so bursts of pushes don't queue up runners
# (the account shares a fixed number of concurrent jobs across all its repositories).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-notes:
    name: Release-note contract
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          package-manager-cache: false

      - name: Validate release-note fragment or explicit opt-out
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/pr-body.md"
          printf '%s' "$PR_BODY" > "$body_file"
          node scripts/check-release-notes.mjs \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --pr-body "$body_file" \
            --summary-file "$GITHUB_STEP_SUMMARY"

  # Dependency and secret hygiene, in one job so `npm ci` runs once instead of three times.
  # None of these steps needs native modules built, so lifecycle scripts (arbitrary code
  # from transitive deps) are skipped.
  # Keep GitHub-hosted runners as the default. Set TRUSTED_MAIN_RUNNERS_ENABLED=true only
  # after the restricted trusted-main group is ready.
  sca-scan:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.TRUSTED_MAIN_RUNNERS_ENABLED == 'true' && fromJSON('{"group":"trusted-main","labels":["self-hosted","Linux","X64","host"]}') || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docker: ${{ steps.docker-changes.outputs.docker }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.2.0
        with:
          persist-credentials: false

      # secretlint requires Node >=22
      - name: Setup Node.js 26.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          # GitHub scopes the Actions cache per-branch (a pull_request run cannot write
          # into the cache that push/main runs restore from), and every `npm ci` in this
          # workflow runs with --ignore-scripts, so a compromised dependency cannot run
          # install/postinstall code to tamper with the cache before it's saved. This repo
          # has a single maintainer with push access, so cache-poisoning here is accepted
          # as a low, non-actionable risk instead of splitting cache restore/save by trust.
          cache: "npm" # zizmor: ignore[cache-poisoning]

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Scan for secrets
        run: npm run secretlint

      # Fails if a package.json "overrides" entry (see docs/DEPENDENCIES.md) has become
      # redundant, i.e. every consumer now declares a range that's already safe on its own.
      - name: Check for stale dependency overrides
        run: npm run check:overrides

      # Policy: docs/VULNERABILITY_MANAGEMENT.md §1.3 — Critical/High findings
      # in any direct or transitive dependency block merge/release.
      - name: Audit all dependencies (Critical/High blocks build)
        run: npm audit --audit-level=high

      - name: Audit the locked CI npm runtime (all severities block build)
        run: npm audit --prefix .github/npm-runtime --audit-level=low

      - name: Audit the tracked npm CLI source (all severities block build)
        run: npm audit --prefix .github/npm-source --audit-level=low

      # Policy: docs/VULNERABILITY_MANAGEMENT.md §1.4 — production dependency
      # licenses must be on the allow-list.
      - name: Check dependency licenses
        run: npm run check:licenses

  windows-service:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.TRUSTED_MAIN_RUNNERS_ENABLED == 'true' && fromJSON('{"group":"trusted-main","labels":["self-hosted","Linux","X64","host"]}') || 'ubuntu-latest' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.2.0
        with:
          persist-credentials: false

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore locked Windows service dependencies
        run: dotnet restore installer/windows/Questarr.Service/Questarr.Service.csproj --runtime win-x64 --locked-mode

      - name: Publish self-contained Windows service host
        run: >-
          dotnet publish installer/windows/Questarr.Service/Questarr.Service.csproj
          --configuration Release
          --no-restore
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          --output ./artifacts/windows-service

      - name: Verify published service executable
        run: test -s ./artifacts/windows-service/Questarr.Service.exe

      # docker-build takes ~4 minutes. Pushes to main/release always run it; a PR only
      # does when it touches something that can change the image beyond what `build`
      # already checks (Dockerfile, dependencies, files copied into the image).
      - name: Detect changes that affect the Docker image
        id: docker-changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The files API lists at most 3,000 files; build when the PR is bigger or when
          # either call fails, rather than failing this job or skipping the image.
          count=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.changed_files') || count=""
          if [ -z "$count" ] || [ "$count" -gt 3000 ] \
            || ! changed=$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename'); then
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$changed" | grep -qE '^(Dockerfile|\.dockerignore|entrypoint\.sh|package(-lock)?\.json|requirements/|migrations(-pg)?/|\.github/workflows/ci\.yml$)'; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi

  # One job for the whole suite (~3 min on a standard runner): four shards plus a merge
  # job cost five runners and five `npm ci` for about the same wall time, and runners are
  # what the account runs out of when several PRs are pushed at once.
  test:
    # Bubblewrap needs the Ubuntu 24.04 AppArmor profile installed below. Pin this
    # sandbox job so the ubuntu-latest migration cannot change that runtime unreviewed.
    runs-on: ubuntu-24.04

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.2.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 26.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/questarrng-npm-cache
        with:
          node-version: 26.x
          cache: "npm" # zizmor: ignore[cache-poisoning]

      - name: Prepare reviewed launcher and npm runtime
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/questarrng-npm-cache
          TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          BOOTSTRAP_LAUNCHER_REF: questarr-validation-launcher-20261013
          BOOTSTRAP_LAUNCHER_SHA: 2d7ebb7f337398444dc13a5ce7c5fa5eb32b3538
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$NPM_CONFIG_CACHE"
          if [ -L "$NPM_CONFIG_CACHE" ] || [ ! -d "$NPM_CONFIG_CACHE" ]; then
            echo "The runner npm cache must be a real directory." >&2
            exit 1
          fi
          trusted_root="$RUNNER_TEMP/questarr-trusted-validation"
          mkdir -m 700 "$trusted_root"

          if ! git cat-file -e "$TRUSTED_BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$TRUSTED_BASE_SHA"
          fi
          launcher_sha="$TRUSTED_BASE_SHA"
          if ! git cat-file -e "$launcher_sha:scripts/validation-engine/trusted-test-launcher.mjs" 2>/dev/null; then
            launcher_sha="$BOOTSTRAP_LAUNCHER_SHA"
            if ! [[ "$launcher_sha" =~ ^[a-f0-9]{40}$ ]]; then
              echo "The reviewed bootstrap launcher SHA is not pinned." >&2
              exit 1
            fi
            git fetch --no-tags origin "refs/tags/$BOOTSTRAP_LAUNCHER_REF"
            fetched_launcher_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
            if ! git cat-file -e "$launcher_sha^{commit}" 2>/dev/null || \
              [ "$fetched_launcher_sha" != "$launcher_sha" ]; then
              echo "The permanent bootstrap tag does not match the pinned trusted commit." >&2
              exit 1
            fi
          fi
          git cat-file -e "$launcher_sha:scripts/validation-engine/trusted-test-launcher.mjs"
          git cat-file -e "$launcher_sha:scripts/validation-engine/trusted-test-sandbox-policy.mjs"
          git cat-file -e "$launcher_sha:scripts/validation-engine/trusted-test-source-policy.mjs"
          mkdir -m 700 "$trusted_root/launcher"
          git show "$launcher_sha:scripts/validation-engine/trusted-test-launcher.mjs" > "$trusted_root/launcher/trusted-test-launcher.mjs"
          git show "$launcher_sha:scripts/validation-engine/trusted-test-sandbox-policy.mjs" > "$trusted_root/launcher/trusted-test-sandbox-policy.mjs"
          git show "$launcher_sha:scripts/validation-engine/trusted-test-source-policy.mjs" > "$trusted_root/launcher/trusted-test-source-policy.mjs"

          git cat-file -e "$launcher_sha:scripts/install-npm-runtime.mjs"
          git cat-file -e "$launcher_sha:.github/npm-runtime/package.json"
          git cat-file -e "$launcher_sha:.github/npm-runtime/package-lock.json"
          git cat-file -e "$launcher_sha:.github/npm-source/package.json"
          git cat-file -e "$launcher_sha:.github/npm-source/package-lock.json"
          git archive --format=tar "$launcher_sha" \
            scripts/install-npm-runtime.mjs \
            .github/npm-runtime/package.json \
            .github/npm-runtime/package-lock.json \
            .github/npm-source/package.json \
            .github/npm-source/package-lock.json \
            | tar -x -C "$trusted_root"
          node "$trusted_root/scripts/install-npm-runtime.mjs"

          node --input-type=module - "$GITHUB_WORKSPACE" "$trusted_root/launcher/trusted-test-source-policy.mjs" <<'NODE'
          import { pathToFileURL } from 'node:url';
          const candidateRoot = process.argv[2];
          const policyPath = process.argv[3];
          const { validateCandidateLockfile } = await import(pathToFileURL(policyPath).href);
          validateCandidateLockfile(candidateRoot);
          NODE

      - name: Install Bubblewrap for isolated tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
          # Allow Bubblewrap itself to create the namespace it needs, without
          # disabling the restriction globally for the runner.
          profile="$RUNNER_TEMP/questarr-bubblewrap.apparmor"
          cat > "$profile" <<'APPARMOR'
          abi <abi/4.0>,
          include <tunables/global>
          profile questarr_bubblewrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          APPARMOR
          sudo apparmor_parser --add "$profile"
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          bwrap --die-with-parent --unshare-user --ro-bind / / -- /bin/true

      - name: Run source-bound test plan
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/questarrng-npm-cache
          VALIDATION_RECEIPT_EXPORT: ${{ runner.temp }}/quest-validation-receipts/test.json
        run: |
          node "$RUNNER_TEMP/questarr-trusted-validation/launcher/trusted-test-launcher.mjs" \
            "$GITHUB_WORKSPACE" \
            --github-actions-context \
            --npm-cache "$NPM_CONFIG_CACHE" \
            --trusted-npm-runtime "$RUNNER_TEMP/questarr-trusted-validation/.github/npm-runtime/node_modules" \
            --install-dependencies \
            --receipt-output "$VALIDATION_RECEIPT_EXPORT" \
            --reports-output "$RUNNER_TEMP/quest-codecov-reports" \
            -- node scripts/validate-development.mjs --tests-only

      - name: Upload source-bound test receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-receipt-tests-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quest-validation-receipts/test.json
          if-no-files-found: warn
          retention-days: 1

      - name: Upload Codecov reports for the trusted workflow
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codecov-reports-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quest-codecov-reports
          if-no-files-found: warn
          retention-days: 1

  build:
    name: Build and check on Node ${{ matrix.node-version }}
    runs-on: ubuntu-24.04

    # PRs build on the minimum supported Node only (tests already run on 26.x);
    # pushes to main/release also build on 26.x.
    strategy:
      matrix:
        node-version: ${{ fromJSON(github.event_name == 'pull_request' && '["22.19.0"]' || '["22.19.0", "26.x"]') }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.2.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/questarrng-npm-cache
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm" # zizmor: ignore[cache-poisoning]

      - name: Prepare reviewed launcher and npm runtime
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/questarrng-npm-cache
          TRUSTED_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          BOOTSTRAP_LAUNCHER_REF: questarr-validation-launcher-20261013
          BOOTSTRAP_LAUNCHER_SHA: 2d7ebb7f337398444dc13a5ce7c5fa5eb32b3538
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$NPM_CONFIG_CACHE"
          if [ -L "$NPM_CONFIG_CACHE" ] || [ ! -d "$NPM_CONFIG_CACHE" ]; then
            echo "The runner npm cache must be a real directory." >&2
            exit 1
          fi
          trusted_root="$RUNNER_TEMP/questarr-trusted-validation"
          mkdir -m 700 "$trusted_root"

          if ! git cat-file -e "$TRUSTED_BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$TRUSTED_BASE_SHA"
          fi
          launcher_sha="$TRUSTED_BASE_SHA"
          if ! git cat-file -e "$launcher_sha:scripts/validation-engine/trusted-test-launcher.mjs" 2>/dev/null; then
            launcher_sha="$BOOTSTRAP_LAUNCHER_SHA"
            if ! [[ "$launcher_sha" =~ ^[a-f0-9]{40}$ ]]; then
              echo "The reviewed bootstrap launcher SHA is not pinned." >&2
              exit 1
            fi
            git fetch --no-tags origin "refs/tags/$BOOTSTRAP_LAUNCHER_REF"
            fetched_launcher_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"
            if ! git cat-file -e "$launcher_sha^{commit}" 2>/dev/null || \
              [ "$fetched_launcher_sha" != "$launcher_sha" ]; then
              echo "The permanent bootstrap tag does not match the pinned trusted commit." >&2
              exit 1
            fi
          fi
          git cat-file -e "$launcher_sha:scripts/validation-engine/trusted-test-launcher.mjs"
          git cat-file -e "$launcher_sha:scripts/validation-engine/trusted-test-sandbox-policy.mjs"
          git cat-file -e "$launcher_sha:scripts/validation-engine/trusted-test-source-policy.mjs"
          mkdir -m 700 "$trusted_root/launcher"
          git show "$launcher_sha:scripts/validation-engine/trusted-test-launcher.mjs" > "$trusted_root/launcher/trusted-test-launcher.mjs"
          git show "$launcher_sha:scripts/validation-engine/trusted-test-sandbox-policy.mjs" > "$trusted_root/launcher/trusted-test-sandbox-policy.mjs"
          git show "$launcher_sha:scripts/validation-engine/trusted-test-source-policy.mjs" > "$trusted_root/launcher/trusted-test-source-policy.mjs"

          git cat-file -e "$launcher_sha:scripts/install-npm-runtime.mjs"
          git cat-file -e "$launcher_sha:.github/npm-runtime/package.json"
          git cat-file -e "$launcher_sha:.github/npm-runtime/package-lock.json"
          git cat-file -e "$launcher_sha:.github/npm-source/package.json"
          git cat-file -e "$launcher_sha:.github/npm-source/package-lock.json"
          git archive --format=tar "$launcher_sha" \
            scripts/install-npm-runtime.mjs \
            .github/npm-runtime/package.json \
            .github/npm-runtime/package-lock.json \
            .github/npm-source/package.json \
            .github/npm-source/package-lock.json \
            | tar -x -C "$trusted_root"
          node "$trusted_root/scripts/install-npm-runtime.mjs"

          node --input-type=module - "$GITHUB_WORKSPACE" "$trusted_root/launcher/trusted-test-source-policy.mjs" <<'NODE'
          import { pathToFileURL } from 'node:url';
          const candidateRoot = process.argv[2];
          const policyPath = process.argv[3];
          const { validateCandidateLockfile } = await import(pathToFileURL(policyPath).href);
          validateCandidateLockfile(candidateRoot);
          NODE

      - name: Install Bubblewrap for isolated build
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          profile="$RUNNER_TEMP/questarr-bubblewrap.apparmor"
          cat > "$profile" <<'APPARMOR'
          abi <abi/4.0>,
          include <tunables/global>
          profile questarr_bubblewrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          APPARMOR
          sudo apparmor_parser --add "$profile"
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          bwrap --die-with-parent --unshare-user --ro-bind / / -- /bin/true

      # The registered task owns dependency installation, lint, formatting,
      # type checking, build output, and the receipt for this Node matrix node.
      - name: Run source-bound build plan
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/questarrng-npm-cache
          VALIDATION_RECEIPT_EXPORT: ${{ runner.temp }}/quest-validation-receipts/build-node-${{ matrix.node-version }}.json
        run: |
          node "$RUNNER_TEMP/questarr-trusted-validation/launcher/trusted-test-launcher.mjs" \
            "$GITHUB_WORKSPACE" \
            --github-actions-context \
            --npm-cache "$NPM_CONFIG_CACHE" \
            --trusted-npm-runtime "$RUNNER_TEMP/questarr-trusted-validation/.github/npm-runtime/node_modules" \
            --install-dependencies \
            --receipt-output "$VALIDATION_RECEIPT_EXPORT" \
            -- node scripts/validate-development.mjs --task build-output

      - name: Upload source-bound build receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-receipt-build-${{ matrix.node-version }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quest-validation-receipts/build-node-${{ matrix.node-version }}.json
          if-no-files-found: warn
          retention-days: 1

  reconcile-validation:
    name: Reconcile test and build node receipts
    runs-on: ubuntu-latest
    needs: [test, build]
    if: always() && !cancelled()

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.2.0
        with:
          persist-credentials: false

      - name: Set up Node.js 26.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.x
          package-manager-cache: false

      - name: Download validation node receipts
        if: always()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/quest-validation-receipts
          pattern: validation-receipt-*-attempt-${{ github.run_attempt }}
          merge-multiple: true

      - name: Reconcile current workflow attempt
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        run: >-
          node scripts/validation-engine/reconcile-ci.mjs
          --receipts "${{ runner.temp }}/quest-validation-receipts"
          --expected-node-majors "${{ github.event_name == 'pull_request' && '22' || '22,26' }}"

  docker-build:
    runs-on: ubuntu-latest
    needs: [sca-scan, build, test, reconcile-validation]
    if: needs.sca-scan.outputs.docker == 'true'

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit
          allowed-endpoints: >
            pypi.org:443
            files.pythonhosted.org:443
            www.rarlab.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.2.0
        with:
          persist-credentials: false

      - name: Pre-pull BuildKit image
        run: |
          for i in {1..5}; do
            docker pull moby/buildkit:buildx-stable-1 && break
            echo "Pull failed, retrying in 5 seconds..."
            sleep 5
          done

      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@e50058a0fcd8d1a7d626c905502d010a468bf238 # v4.4.1
      - name: Build Docker image
        uses: step-security/docker-build-push-action@b736dc8a921e02a288f956d3dd9111e276a4cfec # v7.4.0
        with:
          context: .
          push: false
