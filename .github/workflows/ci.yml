# ng-runner-policy: private-jit-only-v1
name: CI

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

# Keep each run's result attached to its exact candidate; newer pushes must not
# cancel builds already in progress.
concurrency:
  group: ng-ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.action == 'edited' && 'metadata' || 'code' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-notes:
    name: Release-note contract
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-questarrng","ng-main-run-{0}"]}}', github.run_id)) }}
    permissions:
      contents: read

    steps:
      - name: Checkout history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          package-manager-cache: false

      - name: Validate release-note fragment or explicit opt-out
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/pr-body.md"
          printf '%s' "$PR_BODY" > "$body_file"
          node scripts/check-release-notes.mjs \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --pr-body "$body_file" \
            --summary-file "$GITHUB_STEP_SUMMARY"

  # Dependency and secret hygiene, in one job so `npm ci` runs once instead of three times.
  # None of these steps needs native modules built, so lifecycle scripts (arbitrary code
  # from transitive deps) are skipped.
  sca-scan:
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-questarrng","ng-main-run-{0}"]}}', github.run_id)) }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docker: ${{ steps.docker-changes.outputs.docker }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # secretlint requires Node >=22
      - name: Setup Node.js 26.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          # GitHub scopes the Actions cache per-branch (a pull_request run cannot write
          # into the cache that push/main runs restore from), and every `npm ci` in this
          # workflow runs with --ignore-scripts, so a compromised dependency cannot run
          # install/postinstall code to tamper with the cache before it's saved. This repo
          # has a single maintainer with push access, so cache-poisoning here is accepted
          # as a low, non-actionable risk instead of splitting cache restore/save by trust.
          cache: "npm" # zizmor: ignore[cache-poisoning]

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Scan for secrets
        run: npm run secretlint

      # Fails if a package.json "overrides" entry (see docs/DEPENDENCIES.md) has become
      # redundant, i.e. every consumer now declares a range that's already safe on its own.
      - name: Check for stale dependency overrides
        run: npm run check:overrides

      # Policy: docs/VULNERABILITY_MANAGEMENT.md §1.3 — Critical/High findings
      # in any direct or transitive dependency block merge/release.
      - name: Audit all dependencies (Critical/High blocks build)
        run: npm audit --audit-level=high

      # Policy: docs/VULNERABILITY_MANAGEMENT.md §1.4 — production dependency
      # licenses must be on the allow-list.
      - name: Check dependency licenses
        run: npm run check:licenses

  windows-service:
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-questarrng","ng-main-run-{0}"]}}', github.run_id)) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/questarrng-dotnet-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          dotnet-version: '10.0.402'

      - name: Verify selected .NET SDK
        run: '"$RUNNER_TEMP/questarrng-dotnet-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/dotnet" --version'

      - name: Restore locked Windows service dependencies
        run: >-
          "$RUNNER_TEMP/questarrng-dotnet-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/dotnet" restore
          installer/windows/Questarr.Service/Questarr.Service.csproj
          --runtime win-x64
          --locked-mode

      - name: Publish self-contained Windows service host
        run: >-
          "$RUNNER_TEMP/questarrng-dotnet-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/dotnet" publish
          installer/windows/Questarr.Service/Questarr.Service.csproj
          --configuration Release
          --no-restore
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          --output ./artifacts/windows-service

      - name: Verify published service executable
        run: test -s ./artifacts/windows-service/Questarr.Service.exe

      # docker-build takes ~4 minutes. Pushes to main/release always run it; a PR only
      # does when it touches something that can change the image beyond what `build`
      # already checks (Dockerfile, dependencies, files copied into the image).
      - name: Detect changes that affect the Docker image
        id: docker-changes
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The files API lists at most 3,000 files; build when the PR is bigger or when
          # either call fails, rather than failing this job or skipping the image.
          count=$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.changed_files') || count=""
          if [ -z "$count" ] || [ "$count" -gt 3000 ] \
            || ! changed=$(gh api --paginate "repos/$REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename'); then
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$changed" | grep -qE '^(Dockerfile|\.dockerignore|entrypoint\.sh|package(-lock)?\.json|requirements/|migrations(-pg)?/|\.github/workflows/ci\.yml$)'; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clean up temporary .NET SDK
        if: always()
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/questarrng-dotnet-${{ github.run_id }}-${{ github.run_attempt }}
        run: rm -rf -- "$DOTNET_INSTALL_DIR"

  # Pull requests run app tests on GitHub-hosted runners; only trusted main runs
  # use the isolated shared runner pool.
  test:
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-questarrng","ng-main-run-{0}"]}}', github.run_id)) }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 26.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/questarrng-npm-cache
        with:
          node-version: 26.x
          cache: "npm" # zizmor: ignore[cache-poisoning]

      - name: Install locked JavaScript dependencies
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/questarrng-npm-cache
          NODE_USE_ENV_PROXY: '1'
        run: npm ci --ignore-scripts

      - name: Run Vitest coverage suite
        env:
          QUESTARR_CI_VITEST_MAX_WORKERS: "4"
        run: >-
          npm run test:coverage --
          --reporter=default
          --reporter=junit
          --outputFile.junit=test-report.junit.xml

      # Playwright runs in e2e.yml after its isolated test server starts.

      - name: Collect reports for diagnostics and Codecov
        if: always()
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/quest-codecov-reports"
          mkdir -p "$report_dir"
          if [ -d coverage ]; then cp -a coverage "$report_dir/"; fi
          if [ -f test-report.junit.xml ]; then cp -a test-report.junit.xml "$report_dir/"; fi

      - name: Upload pull-request reports for diagnosis
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quest-codecov-reports
          if-no-files-found: warn
          retention-days: 3

      - name: Upload Codecov reports for the trusted workflow
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codecov-reports-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quest-codecov-reports
          if-no-files-found: warn
          retention-days: 1

  build:
    name: Build and check on Node ${{ matrix.node-version }}
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-questarrng","ng-main-run-{0}"]}}', github.run_id)) }}

    # PRs build on the minimum supported Node only (tests already run on 26.x);
    # pushes to main/release also build on 26.x.
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(github.event_name == 'pull_request' && '["22.23.4"]' || '["22.23.4", "26.x"]') }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/questarrng-npm-cache
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm" # zizmor: ignore[cache-poisoning]

      - name: Install locked JavaScript dependencies
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/questarrng-npm-cache
          NODE_USE_ENV_PROXY: '1'
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Build production assets
        run: npm run build

      - name: Verify production build output
        run: test -d dist

  docker-build:
    env:
      BUILDKIT_EGRESS_PROXY: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (contains(fromJSON('["push","workflow_dispatch","schedule","release","repository_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')))) && 'http://10.0.2.100:3128' || '' }}
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-questarrng","ng-main-run-{0}"]}}', github.run_id)) }}
    needs: [sca-scan, build, test]
    if: needs.sca-scan.outputs.docker == 'true'

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          allowed-endpoints: >
            pypi.org:443
            files.pythonhosted.org:443
            www.rarlab.com:443

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pre-pull BuildKit image
        run: |
          for i in {1..5}; do
            docker pull moby/buildkit:buildx-stable-1 && break
            echo "Pull failed, retrying in 5 seconds..."
            sleep 5
          done

      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@e50058a0fcd8d1a7d626c905502d010a468bf238 # v4.4.1
        with:
          # The isolated BuildKit daemon needs the runner's trust roots too.
          buildkitd-config-inline: |
            [registry."docker.io"]
              ca = ["/etc/ssl/certs/ca-certificates.crt"]
          driver-opts: |
            env.HTTP_PROXY=${{ env.BUILDKIT_EGRESS_PROXY }}
            env.HTTPS_PROXY=${{ env.BUILDKIT_EGRESS_PROXY }}
            env.http_proxy=${{ env.BUILDKIT_EGRESS_PROXY }}
            env.https_proxy=${{ env.BUILDKIT_EGRESS_PROXY }}
            env.SSL_CERT_FILE=/etc/buildkit/certs/docker.io/ca-certificates.crt
      - name: Build Docker image
        uses: step-security/docker-build-push-action@b736dc8a921e02a288f956d3dd9111e276a4cfec # v7.4.0
        with:
          context: .
          push: false
          tags: questarr:test
          build-args: |
            HTTP_PROXY=${{ env.BUILDKIT_EGRESS_PROXY }}
            HTTPS_PROXY=${{ env.BUILDKIT_EGRESS_PROXY }}
            http_proxy=${{ env.BUILDKIT_EGRESS_PROXY }}
            https_proxy=${{ env.BUILDKIT_EGRESS_PROXY }}
            NO_PROXY=localhost,127.0.0.1
            no_proxy=localhost,127.0.0.1
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Verify Docker image
        run: |
          echo "Docker image built successfully"
          docker images | grep questarr || echo "Image not found in docker images, but build completed"
