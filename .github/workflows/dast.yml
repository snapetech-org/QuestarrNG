# ng-runner-policy: private-jit-only-v1
name: DAST


run-name: >-
  ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
      format('action:ci:pool:private:tag:{0}', github.ref_name) ||
      github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/') &&
      format('action:{0}:pool:{1}:tag:{2}', inputs.action || 'scan', inputs.runner_pool || 'private', github.ref_name) ||
      github.event_name == 'workflow_dispatch' &&
      format('action:{0}:pool:{1}', inputs.action || 'scan', inputs.runner_pool || 'private') || format('action:ci:pool:private') }}
on:

  workflow_dispatch:
    inputs:
      action:
        description: Required manual workflow action
        type: choice
        options: [ci]
        required: true
      runner_pool:
        description: Required private JIT runner pool
        type: choice
        options: [private]
        required: true

concurrency:
  group: ng-scan-dast-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  zap-baseline:
    name: OWASP ZAP baseline scan
    # ZAP's action starts a container; the repository JIT runner intentionally
    # has no Docker daemon, so this scan runs on a Docker-capable hosted runner.
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'ci' &&
          inputs.runner_pool == 'private'
        )
      ) &&
      (
        true
      )
    runs-on: ${{ fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-questarrng","ng-main-run-{0}","gha-{0}-zap-baseline"]}}', github.run_id)) }}
    timeout-minutes: 20

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: "npm"

      # Lifecycle scripts are required here (unlike the ci.yml lint/build job):
      # this job actually starts the built server against a real SQLite file below,
      # which needs better-sqlite3's native binding compiled during install.
      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # ZAP rule 10110 uses text matching and can mistake library methods named
      # `eval` for the global dynamic-code evaluator. Keep a syntax-aware check
      # over the exact served bundles when that rule is ignored below.
      - name: Check built JavaScript for dangerous calls
        run: node scripts/check-built-js-security.mjs dist/public/assets

      # Runs the built production server directly on the runner (rather than
      # in Docker) so the ZAP container, started by zaproxy/action-baseline
      # with --network host, can reach it at http://localhost:5000.
      - name: Start server
        env:
          NODE_ENV: production
          PORT: "5000"
          HOST: "127.0.0.1"
          SQLITE_DB_PATH: "data/dast-test.db"
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid

          for _ in $(seq 1 30); do
            if curl -sf http://localhost:5000/api/health > /dev/null; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done

          echo "Server did not become healthy in time" >&2
          cat server.log >&2
          exit 1

      # Unauthenticated baseline scan: spiders the app and passively checks
      # responses for common issues (missing security headers, verbose
      # errors, cookie flags, etc.). Blocking as of the first completed run
      # (2026-07-14): that run had 0 FAIL-level alerts and 5 WARN-level
      # alerts, all since either fixed (server/routes.ts CSP/Permissions-
      # Policy) or explicitly accepted in .zap/rules.tsv. See
      # docs/VULNERABILITY_MANAGEMENT.md §3 and docs/BEST_PRACTICES.md
      # [dynamic_analysis_fixed] for the findings and remediation record.
      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: "http://localhost:5000"
          rules_file_name: ".zap/rules.tsv"
          fail_action: true
          allow_issue_writing: false
          artifact_name: "zap-baseline-report"

      - name: Stop server
        if: always()
        run: kill "$(cat server.pid)" 2>/dev/null || true
