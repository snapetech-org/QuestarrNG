name: Deploy Web App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Development or test image channel"
        required: true
        default: "test"
        type: choice
        options:
          - dev
          - test
      tag:
        description: "Optional non-release Docker image tag"
        required: false
        default: ""
      build_arm64:
        description: "Also build ARM64 for this development or test image"
        required: false
        default: false
        type: boolean
      build_windows_installer:
        description: "Also build the Windows installer (.exe, optional extra build)"
        required: false
        default: false
        type: boolean
      comment-id: # ← passed automatically by slash-command-dispatch
        required: false
      repository: # ← also passed automatically
        required: false

  # Run daily at midnight from the default branch (main) for dev builds
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Policy: docs/VULNERABILITY_MANAGEMENT.md §1.3 — no release may ship with
  # an unresolved Critical/High SCA finding. Runs again here (not just in
  # ci.yml) so a fresh advisory published after `main` was merged still
  # blocks the release.
  sca-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js 22.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: "npm"

      # This job only audits the dependency tree and checks licenses; it never
      # executes application code, so native module build scripts aren't needed.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit all dependencies (Critical/High blocks release)
        run: npm audit --audit-level=high

      - name: Check dependency licenses
        run: npm run check:licenses

  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment == 'test' && 'test' || 'dev' }}
    needs: sca-gate
    permissions:
      contents: read
      packages: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Determine Environment
        id: env
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" == "schedule" ]; then
            echo "ENVIRONMENT=dev" >> $GITHUB_ENV
            echo "environment=dev" >> $GITHUB_OUTPUT
          else
            echo "ENVIRONMENT=${INPUT_ENVIRONMENT:-dev}" >> $GITHUB_ENV
            echo "environment=${INPUT_ENVIRONMENT:-dev}" >> $GITHUB_OUTPUT
          fi

          # Normalize the package name for GitHub Container Registry maintenance.
          REPO_NAME="$REPOSITORY"
          # Get the part after the slash (repo name only)
          REPO_SHOULD_BE_NAME="${REPO_NAME##*/}"
          # Lowercase
          REPO_NAME_LC=$(echo "$REPO_SHOULD_BE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "REPO_NAME_LC=$REPO_NAME_LC" >> $GITHUB_ENV

          # Full owner/repo, lowercased (GHCR requires lowercase image references)
          REPO_LC=$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "REPO_LC=$REPO_LC" >> $GITHUB_ENV

      - name: Keep production release tags on the version-tag workflow
        shell: bash
        env:
          DEPLOY_ENVIRONMENT: ${{ steps.env.outputs.environment }}
          IMAGE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$DEPLOY_ENVIRONMENT" == 'production' || "$IMAGE_TAG" == 'latest' || "$IMAGE_TAG" == 'production' || "$IMAGE_TAG" == v* || "$IMAGE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+].*)?$ ]]; then
            echo 'Production and version image tags are published only by a validated vMAJOR.MINOR.PATCH tag push.' >&2
            exit 1
          fi

      # Single source of truth for whether this run builds ARM64, so the
      # "Set up QEMU" condition below and the `platforms:` expression in the
      # build step can't drift out of sync with each other.
      - name: Determine ARM64 build
        id: arch
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
          BUILD_ARM64: ${{ inputs.build_arm64 }}
        run: |
          if [ "$BUILD_ARM64" == "true" ]; then
            echo "multiarch_enabled=true" >> $GITHUB_OUTPUT
          else
            echo "multiarch_enabled=false" >> $GITHUB_OUTPUT
          fi

      # Version-tagged releases always build both architectures in
      # fork-image.yml. This workflow is limited to development and test images.
      - name: Set up QEMU
        if: steps.arch.outputs.multiarch_enabled == 'true'
        uses: step-security/setup-qemu-action@d21542abd2ae44772cf2276e75ee4ec531d598b6 # v4.4.0

      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@e50058a0fcd8d1a7d626c905502d010a468bf238 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: step-security/docker-login-action@8c7b695d8738c5699a679ff5254baf0f19f20a94 # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from package.json
        id: package_version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=raw,value=dev,enable=${{ env.ENVIRONMENT == 'dev' }}
            type=sha,prefix=${{ env.ENVIRONMENT }}-sha-,format=short,enable=${{ env.ENVIRONMENT != 'dev' }}
          labels: |
            org.opencontainers.image.title=QuestarrNG
            org.opencontainers.image.description=QuestarrNG game discovery, acquisition, and SeerrNG request delivery.
            org.opencontainers.image.vendor=Snapetech

      - name: Build and push Docker image
        id: build
        uses: step-security/docker-build-push-action@b736dc8a921e02a288f956d3dd9111e276a4cfec # v7.4.0
        with:
          context: .
          build-args: QUESTARR_VERSION=${{ steps.package_version.outputs.version }}
          # Dev/test stay amd64-only (and fast) unless build_arm64 is explicitly
          # requested. Version-tagged production releases use fork-image.yml.
          platforms: ${{ steps.arch.outputs.multiarch_enabled == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production
          sbom: true

      - name: Prune stale test-sha GHCR tags (keep 15 days)
        if: github.event_name == 'schedule' && env.ENVIRONMENT == 'dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: ${{ env.REPO_NAME_LC }}
        run: |
          set -euo pipefail

          cutoff_epoch=$(date -u -d '15 days ago' +%s)
          deleted_count=0

          if gh api "/orgs/${OWNER}/packages/container/${PACKAGE_NAME}/versions?per_page=1" >/dev/null 2>&1; then
            package_api="/orgs/${OWNER}/packages/container/${PACKAGE_NAME}"
          else
            package_api="/users/${OWNER}/packages/container/${PACKAGE_NAME}"
          fi

          # Every non-dev test build adds a `test-sha-<hash>` tag that never
          # goes untagged, so the digest-based prune below never reclaims it -
          # left alone, this list grows forever. Only delete a version here if
          # ALL of its current tags match that auto-generated pattern; a
          # version that also carries "latest", a `production-sha-*` tag, or
          # any human-chosen tag (a release like v1.3.0, a custom
          # workflow_dispatch tag like test-xxx, ...) is always kept.
          while IFS=$'\t' read -r version_id created_at tags_json; do
            all_auto=true
            while IFS= read -r t; do
              [ -z "$t" ] && continue
              if ! [[ "$t" =~ ^test-sha-[0-9a-f]+$ ]]; then
                all_auto=false
                break
              fi
            done < <(jq -r '.[]' <<< "${tags_json}")

            if [ "${all_auto}" != true ]; then
              continue
            fi

            created_epoch=$(date -u -d "${created_at}" +%s)
            if [ "${created_epoch}" -lt "${cutoff_epoch}" ]; then
              echo "Deleting stale test-sha version ${version_id} (${created_at}, tags: ${tags_json})"
              gh api -X DELETE "${package_api}/versions/${version_id}"
              deleted_count=$((deleted_count + 1))
            fi
          done < <(
            gh api --paginate "${package_api}/versions?per_page=100" \
              --jq '.[] | select((.metadata.container.tags // []) | length > 0) | "\(.id)\t\(.created_at)\t\(.metadata.container.tags | tojson)"'
          )

          echo "Pruned ${deleted_count} stale test-sha GHCR tag(s)."

      - name: Prune old GHCR package versions (keep 15 days)
        if: github.event_name == 'schedule' && env.ENVIRONMENT == 'dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: ${{ env.REPO_NAME_LC }}
          REPO_LC: ${{ env.REPO_LC }}
        run: |
          set -euo pipefail

          cutoff_epoch=$(date -u -d '15 days ago' +%s)
          deleted_count=0

          if gh api "/orgs/${OWNER}/packages/container/${PACKAGE_NAME}/versions?per_page=1" >/dev/null 2>&1; then
            package_api="/orgs/${OWNER}/packages/container/${PACKAGE_NAME}"
          else
            package_api="/users/${OWNER}/packages/container/${PACKAGE_NAME}"
          fi

          # Because the build enables `sbom: true`, buildx pushes every tag
          # (even single-platform ones) as an OCI index containing the image
          # manifest plus an attestation manifest. Only the index carries a
          # tag - its children show up here as "untagged" versions even
          # though a live tag still points at them. Deleting those once they
          # age past the cutoff leaves the tag's index referencing content
          # that no longer exists, breaking `docker pull` with a
          # "manifest ... not found" error. Build the set of digests
          # referenced by any currently tagged manifest and never delete
          # those, regardless of age.
          echo "Collecting digests referenced by tagged manifests..."
          referenced_digests=$(mktemp)
          tagged_names=$(gh api --paginate "${package_api}/versions?per_page=100" \
            --jq '.[] | (.metadata.container.tags // [])[]' | sort -u)

          for tag in ${tagged_names}; do
            docker buildx imagetools inspect "ghcr.io/${REPO_LC}:${tag}" --raw \
              | jq -r '.manifests[]?.digest // empty' >> "${referenced_digests}"
          done
          sort -u -o "${referenced_digests}" "${referenced_digests}"

          while IFS=$'\t' read -r version_id created_at digest; do
            if grep -qxF "${digest}" "${referenced_digests}"; then
              echo "Skipping ${digest} (still referenced by a tagged manifest)"
              continue
            fi
            created_epoch=$(date -u -d "${created_at}" +%s)
            if [ "${created_epoch}" -lt "${cutoff_epoch}" ]; then
              echo "Deleting untagged version ${version_id} (${created_at})"
              gh api -X DELETE "${package_api}/versions/${version_id}"
              deleted_count=$((deleted_count + 1))
            fi
          done < <(
            gh api --paginate "${package_api}/versions?per_page=100" \
              --jq '.[] | select(((.metadata.container.tags // []) | length) == 0) | "\(.id)\t\(.created_at)\t\(.name)"'
          )

          rm -f "${referenced_digests}"
          echo "Pruned ${deleted_count} old GHCR package version(s)."

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ env.REPO_LC }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-questarr-${{ env.VERSION }}.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-questarr-${{ env.VERSION }}-${{ env.ENVIRONMENT }}
          path: sbom-questarr-${{ env.VERSION }}.spdx.json
          retention-days: 90

      - name: Deployment summary
        id: summary
        run: |
          TAG="latest"
          if [ "${{ env.ENVIRONMENT }}" == "dev" ]; then
            TAG="dev"
          fi

          SUMMARY=$(cat << EOF
          ## Deployment Summary

          - **Environment:** ${{ env.ENVIRONMENT }}
          - **Image:** ghcr.io/${{ env.REPO_LC }}
          - **Tags:** ${{ steps.meta.outputs.tags }}
          - **SBOM:** attached to the image as an attestation, and uploaded as the \`sbom-questarr-${{ env.VERSION }}-${{ env.ENVIRONMENT }}\` workflow artifact

          ### Pull and run the image:
          \`\`\`bash
          docker pull ghcr.io/${{ env.REPO_LC }}:\$TAG
          docker run -d -p 5000:5000 \\
            -e POSTGRES_PASSWORD=your_password \\
            -e IGDB_CLIENT_ID=your_client_id \\
            -e IGDB_CLIENT_SECRET=your_client_secret \\
            ghcr.io/${{ env.REPO_LC }}:\$TAG
          \`\`\`

          ### Inspect the SBOM attestation:
          \`\`\`bash
          docker buildx imagetools inspect ghcr.io/${{ env.REPO_LC }}:\$TAG --format '{{ json (index .SBOM "linux/amd64").SPDX }}'
          \`\`\`
          EOF
          )

          echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY

          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post result to PR
        if: always() && inputs.comment-id != ''
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          token: ${{ secrets.PAT }}
          repository: ${{ inputs.repository }}
          comment-id: ${{ inputs.comment-id }}
          body: ${{ steps.summary.outputs.content }}

  # Optional non-release installer builds remain available for dev/test validation.
  # Version-tag releases call the same reusable workflow and publish its artifact
  # only after the container scans and smoke checks pass.
  windows-installer:
    name: Build optional Windows installer
    needs: sca-gate
    if: github.event_name == 'workflow_dispatch' && inputs.build_windows_installer == true
    permissions:
      contents: write
    uses: ./.github/workflows/windows-installer.yml
    with:
      source_ref: ${{ github.sha }}
      release_tag: ""
