# ng-runner-policy: hosted-first-v1
name: Helm chart

on:
  push:
    tags:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint-and-template:
    runs-on: ${{ (vars.NG_HOSTED_FIRST != 'true' || vars.NG_FORCE_JIT == 'true' || github.run_attempt > 1) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.ref == 'refs/heads/main' && fromJSON(format('{{"group":"ng-shared-main-jit","labels":["self-hosted","linux","x64","ng-shared-main-questarrng","ng-main-run-{0}"]}}', github.run_id)) || 'ubuntu-latest' }}

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Helm
        env:
          HELM_SHA256: 896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea
          HELM_VERSION: v3.22.1
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/helm-${HELM_VERSION}-linux-amd64.tar.gz"
          unpack_dir="$RUNNER_TEMP/helm-unpack"
          bin_dir="$RUNNER_TEMP/helm-bin"
          curl --fail --location --retry 3 --silent --show-error \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$HELM_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$unpack_dir" "$bin_dir"
          tar -xzf "$archive" --directory "$unpack_dir"
          install -m 0755 "$unpack_dir/linux-amd64/helm" "$bin_dir/helm"
          rm -f "$archive"
          rm -rf "$unpack_dir"
          printf '%s\n' "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/helm" version --short

      - name: Lint the chart with default values
        run: helm lint charts/questarr

      - name: Render the chart with default values
        run: helm template questarr charts/questarr > /dev/null

      # Exercises the option combinations most likely to break templating:
      # ingress, a subpath deployment, inline secrets and extra mounts.
      - name: Render the chart with a full set of options
        run: |
          helm template questarr charts/questarr \
            --set ingress.enabled=true \
            --set ingress.className=nginx \
            --set questarr.basePath=/questarr \
            --set questarr.timezone=Europe/Paris \
            --set service.type=NodePort \
            --set service.nodePort=30500 \
            --set questarr.secrets.igdbClientId=id \
            --set questarr.secrets.igdbClientSecret=secret \
            --set persistence.data.existingClaim=questarr-data \
            > /dev/null

      - name: Render the chart with an existing Secret and no persistence
        run: |
          helm template questarr charts/questarr \
            --set questarr.existingSecret=questarr-secrets \
            --set persistence.data.enabled=false \
            --set questarr.databasePath=/app/data/sqlite.db \
            > /dev/null

      # Every rule in templates/_validate.tpl gets a negative case here.
      - name: Reject invalid values
        run: |
          assert_rejected() {
            description="$1"
            shift
            if helm template questarr charts/questarr "$@" > /dev/null 2>&1; then
              echo "::error::$description should have been rejected"
              exit 1
            fi
            echo "rejected as expected: $description"
          }

          assert_rejected "a second replica (SQLite on a RWO volume)" \
            --set replicaCount=2
          assert_rejected "a database path outside the persisted /app/data" \
            --set questarr.databasePath=/app/sqlite.db
          assert_rejected "a malformed credentials encryption key" \
            --set questarr.secrets.credentialsEncryptionKey=not-hex
          assert_rejected "an unknown entry under questarr.secrets" \
            --set questarr.secrets.notASetting=value

