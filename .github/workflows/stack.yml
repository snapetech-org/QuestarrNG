# ng-runner-policy: hosted-compatible-v1
name: Real stack

# The production build of Questarr against real qBittorrent, Transmission and SABnzbd daemons
# and a fake Torznab/Newznab indexer: setup, connection tests, a grab from the library, the
# client's download and the import into the library (tests/stack/).

# Slow (real daemons, a minute per download check), so it runs on release tags or on demand.

run-name: >-
  ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') &&
      format('action:ci:pool:public:tag:{0}', github.ref_name) ||
      github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/') &&
      format('action:{0}:pool:{1}:tag:{2}', inputs.action || 'ci', inputs.runner_pool || 'public', github.ref_name) ||
      github.event_name == 'workflow_dispatch' &&
      format('action:{0}:pool:{1}', inputs.action || 'ci', inputs.runner_pool || 'public') || format('action:ci:pool:public') }}
on:
  workflow_dispatch:
    inputs:
      action:
        description: Required manual workflow action
        type: choice
        options: [ci]
        required: true
      runner_pool:
        description: Compatible hosted runner pool
        type: choice
        options: [public]
        required: true

concurrency:
  group: stack-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  stack:
    name: Real-stack journey
    if: >-
      (
        github.event_name != 'workflow_dispatch' ||
        (
          github.ref == 'refs/heads/main' &&
          inputs.action == 'ci' &&
          inputs.runner_pool == 'public'
        )
      ) &&
      (
        true
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 26.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          # Same accepted cache-poisoning trade-off as ci.yml (single maintainer with push access).
          cache: "npm" # zizmor: ignore[cache-poisoning]

      # The packaged transmission-daemon would start a system service on 9091 at install
      # time, with DHT on, reaching dht.transmissionbt.com before it could be stopped. A
      # policy-rc.d that refuses service starts keeps it down; the journey runs its own
      # instance with its own profile on that port.
      - name: Install download clients
        run: |
          printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d > /dev/null
          sudo chmod +x /usr/sbin/policy-rc.d
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            qbittorrent-nox transmission-daemon sabnzbdplus p7zip-full
          sudo rm -f /usr/sbin/policy-rc.d
          sudo systemctl stop transmission-daemon || true
          sudo systemctl disable transmission-daemon || true

      # Lifecycle scripts are required: the server opens a real SQLite file through
      # better-sqlite3's native binding.
      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run the real-stack journey
        run: npm run test:stack
        env:
          STACK_DIR: ${{ runner.temp }}/questarr-stack
          QUESTARR_STACK_DATA: ${{ runner.temp }}/questarr-stack-data

      - name: Upload report and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stack-report
          path: |
            playwright-report/
            test-results/
            server.log
            ${{ runner.temp }}/questarr-stack/*.log
          retention-days: 14
