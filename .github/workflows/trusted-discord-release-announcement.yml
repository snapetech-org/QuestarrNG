# ng-runner-policy: hosted-compatible-v1
name: Announce trusted QuestarrNG releases

on:
  workflow_run:
    workflows: ["Publish QuestarrNG image"]
    types: [completed]

permissions:
  contents: read

jobs:
  announce-release:
    if: >-
      github.repository_id == '1388297896' &&
      github.event.workflow_run.workflow_id == 368554729 &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'v') &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: discord-release
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      DISCORD_ANNOUNCEMENT_WEBHOOK: ${{ secrets.DISCORD_ANNOUNCEMENT_WEBHOOK }}
      ANNOUNCEMENT_RECEIPT: discord-release-receipt.json
      TAG: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Checkout trusted default-branch release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          package-manager-cache: false

      - name: Post changelog notes and linked channel announcement
        run: node scripts/announce-discord-release.mjs

      - name: Retain Discord message links
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: discord-release-receipt
          path: discord-release-receipt.json
          if-no-files-found: ignore
          retention-days: 90
