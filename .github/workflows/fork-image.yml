name: Publish QuestarrNG image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      announce_release_tag:
        description: Announce an already-published release without rebuilding the image
        required: false
        type: string
      finalize_release_tag:
        description: Complete a tag release after its image and smoke jobs passed but release-note assembly failed
        required: false
        type: string

permissions:
  contents: read

# The repository ID survives owner transfers; the previous owner/name check
# caused every release job to be skipped after QuestarrNG moved to its org.
concurrency:
  group: fork-image-${{ inputs.finalize_release_tag || inputs.announce_release_tag || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || (inputs.announce_release_tag == '' && inputs.finalize_release_tag == '') }}

jobs:
  publish:
    if: github.repository_id == '1388297896' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: read
      checks: read
      vulnerability-alerts: read
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build-image.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$TAG" != "v$version" ]]; then
            echo "Tag $TAG does not match package version $version."
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH."
            exit 1
          fi
          if ! grep -Fxq "version: \"$version\"" questarr/config.yaml || \
             ! grep -Fxq "ARG QUESTARR_VERSION=$version" questarr/Dockerfile || \
             ! grep -Eq "^ARG QUESTARR_IMAGE=ghcr\.io/snapetech-org/questarrng:[0-9]+\.[0-9]+\.[0-9]+@sha256:[a-f0-9]{64}$" questarr/Dockerfile || \
             ! grep -Fxq "appVersion: \"$version\"" charts/questarr/Chart.yaml || \
             ! grep -Fxq "  version: \"$version\"" casaos/docker-compose.yml || \
             ! grep -Fxq "version: \"$version\"" doezer-questarr/umbrel-app.yml; then
            echo "Home Assistant, Helm, CasaOS, and Umbrel versions must match package.json; the Home Assistant base image must have a pinned digest."
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tag $TAG is not on main."
            exit 1
          }

      - name: Set up Node.js for release security checks
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          package-manager-cache: false

      - name: Require clean security before publishing a versioned image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.SECURITY_READ_TOKEN || github.token }}
        run: node scripts/check-release-security.mjs

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Push only the immutable source tag here. The release job attaches the
      # version and latest tags only after the release assets have passed.
      - name: Set image tags
        id: tags
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Production image publication requires a version tag push." >&2
            exit 1
          fi
          node scripts/fork-image-tags.mjs \
            "$IMAGE" "$GITHUB_REF" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_OUTPUT"

      - name: Set up QEMU for ARM64 release images
        uses: step-security/setup-qemu-action@d21542abd2ae44772cf2276e75ee4ec531d598b6 # v4.4.0

      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@e50058a0fcd8d1a7d626c905502d010a468bf238 # v4.4.1

      - name: Log in to GHCR
        uses: step-security/docker-login-action@8c7b695d8738c5699a679ff5254baf0f19f20a94 # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable source image
        id: build-image
        uses: step-security/docker-build-push-action@b736dc8a921e02a288f956d3dd9111e276a4cfec # v7.4.0
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the published multi-platform source image
        id: verify-image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          BUILD_DIGEST: ${{ steps.build-image.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! "$BUILD_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Build returned an invalid image digest: $BUILD_DIGEST" >&2
            exit 1
          fi
          docker buildx imagetools inspect --raw "${IMAGE}@${BUILD_DIGEST}" > source-image.json
          node scripts/verify-release-image-manifest.mjs source-image.json

      - name: Scan the verified linux/amd64 image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_VEX: security/vex/questarr.openvex.json
        with:
          image-ref: ${{ steps.verify-image.outputs.amd64_image }}
          format: table
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          scanners: "vuln"
          exit-code: "1"
          cache: "false"

      - name: Scan the verified linux/arm64 image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_VEX: security/vex/questarr.openvex.json
        with:
          image-ref: ${{ steps.verify-image.outputs.arm64_image }}
          format: table
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          scanners: "vuln"
          exit-code: "1"
          cache: "false"

      - name: Smoke test published image and SeerrNG route
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          docker volume create questarrng-smoke-data
          docker volume create questarrng-rootless-smoke-data
          trap 'docker stop questarrng-smoke questarrng-rootless-smoke >/dev/null 2>&1 || true; docker volume rm questarrng-smoke-data questarrng-rootless-smoke-data >/dev/null 2>&1 || true' EXIT
          docker run -d --name questarrng-smoke \
            -p 127.0.0.1:15000:5000 \
            -v questarrng-smoke-data:/app/data \
            "$IMAGE"
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:15000/api/health >/dev/null; then
              break
            fi
            if ! docker inspect questarrng-smoke --format '{{.State.Running}}' | grep -qx true; then
              docker logs questarrng-smoke
              exit 1
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:15000/api/health >/dev/null
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:15000/api/integration/seerrng/v1/ping)" = 401
          docker run --rm --user 0:0 \
            -v questarrng-rootless-smoke-data:/app/data \
            --entrypoint sh \
            "$IMAGE" \
            -c 'chown -R 1000:1000 /app/data && touch /app/data/.rootless-smoke'
          docker run -d --name questarrng-rootless-smoke \
            --user 1000:1000 \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -e HOME=/tmp \
            -e QUESTARR_LOG_FILE=/app/data/server.log \
            -p 127.0.0.1:15001:5000 \
            -v questarrng-rootless-smoke-data:/app/data \
            "$IMAGE"
          for _ in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:15001/api/health >/dev/null; then
              break
            fi
            if ! docker inspect questarrng-rootless-smoke --format '{{.State.Running}}' | grep -qx true; then
              docker logs questarrng-rootless-smoke
              exit 1
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:15001/api/health >/dev/null
          test "$(docker exec questarrng-rootless-smoke id -u)" = "1000"

  addon-smoke:
    if: github.repository_id == '1388297896'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: step-security/docker-login-action@8c7b695d8738c5699a679ff5254baf0f19f20a94 # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@e50058a0fcd8d1a7d626c905502d010a468bf238 # v4.4.1

      - name: Build Home Assistant add-on and verify its scoped ownership helper
        shell: bash
        env:
          QUESTARR_IMAGE: ${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          ha_image="questarrng-ha-addon:${version}"
          docker buildx build --load --platform linux/amd64 \
            --build-arg "QUESTARR_IMAGE=${QUESTARR_IMAGE}" \
            --build-arg "QUESTARR_VERSION=${version}" \
            --file questarr/Dockerfile \
            --tag "$ha_image" \
            questarr
          test "$(docker image inspect "$ha_image" --format '{{.Config.User}}')" = "questarr:questarr"

          data_volume="questarrng-ha-data-${GITHUB_RUN_ID}"
          docker volume create "$data_volume" >/dev/null
          trap 'docker volume rm "$data_volume" >/dev/null 2>&1 || true' EXIT
          docker run --rm --user 0:0 \
            --volume "$data_volume:/data" \
            --entrypoint /bin/sh \
            "$ha_image" \
            -c 'umask 077; printf "existing\n" > /data/root-owned.db'
          docker run --rm \
            --volume "$data_volume:/data" \
            "$ha_image" \
            sh -c 'test -w /data && test "$(stat -c "%u:%g" /data/root-owned.db)" = "1000:1000"'

  build-windows-installer:
    name: Build Windows installer
    if: github.repository_id == '1388297896' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [publish, addon-smoke]
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/windows-installer.yml
    with:
      source_ref: ${{ github.sha }}
      release_tag: ${{ github.ref_name }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish, addon-smoke, build-windows-installer]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      packages: write
      security-events: read
      checks: read
      vulnerability-alerts: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - name: Download verified Windows installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: questarr-windows-installer-${{ github.ref_name }}
          path: release-assets

      - name: Package versioned Helm chart
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          chart_version="$(sed -n 's/^version: *//p' charts/questarr/Chart.yaml | head -n 1 | tr -d '\"')"
          if [[ ! "$chart_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Helm chart version: $chart_version" >&2
            exit 1
          fi
          helm lint charts/questarr
          helm package charts/questarr --app-version "$VERSION" --destination release-assets
          chart="questarr-${chart_version}.tgz"
          chart_metadata="$(helm show chart "release-assets/$chart")"
          grep -Fxq "appVersion: $VERSION" <<< "$chart_metadata"
          grep -Fxq "version: $chart_version" <<< "$chart_metadata"
          (cd release-assets && sha256sum "$chart" > "$chart.sha256")

      - name: Verify release asset inventory and checksums
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          installer="QuestarrSetup-${VERSION}-windows-x64.exe"
          chart_version="$(sed -n 's/^version: *//p' charts/questarr/Chart.yaml | head -n 1 | tr -d '\"')"
          chart="questarr-${chart_version}.tgz"
          expected=("$installer" "$installer.sha256" "$chart" "$chart.sha256")
          mapfile -t actual < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${actual[@]}")
          (cd release-assets && sha256sum -c "$installer.sha256" && sha256sum -c "$chart.sha256")

      - name: Upload versioned release asset bundle for recovery
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: questarr-release-assets-${{ github.ref_name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 90

      - name: Require clean security findings and completed source scans
        env:
          GH_TOKEN: ${{ secrets.SECURITY_READ_TOKEN || github.token }}
          RELEASE_REF: ${{ github.ref }}
        run: node scripts/check-release-security.mjs

      - name: Add curated release-note fragments
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          RELEASE_DATE="$(git show -s --format=%cs "$GITHUB_SHA")"
          previous_tag="$(scripts/latest-published-release-tag.sh "$TAG")"
          node scripts/assemble-release-notes.mjs \
            --previous-tag "$previous_tag" \
            --head "$GITHUB_SHA" \
            --version "$VERSION" \
            --date "$RELEASE_DATE" \
            --changelog docs/CHANGELOG.md \
            --output docs/CHANGELOG.md
          node scripts/extract-changelog.mjs "$VERSION" > changelog-section.md
          if ! grep -Eq '^[[:space:]]*-[[:space:]]+' changelog-section.md; then
            echo 'Generated release notes contain no changelog entries.' >&2
            exit 1
          fi

      - name: Add image pull instructions
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          chart_version="$(sed -n 's/^version: *//p' charts/questarr/Chart.yaml | head -n 1 | tr -d '\"')"
          chart="questarr-${chart_version}.tgz"
          {
            echo ""
            echo "**Container image**: \`${IMAGE}:${VERSION}\`"
            echo "- [GitHub Container Registry](https://github.com/orgs/snapetech-org/packages/container/package/questarrng)"
            echo ""
            echo "Pull with: \`docker pull ${IMAGE}:${VERSION}\`."
            echo ""
            echo "**Windows installer**: [QuestarrSetup-${VERSION}-windows-x64.exe](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/QuestarrSetup-${VERSION}-windows-x64.exe)"
            echo "- [SHA-256 checksum](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/QuestarrSetup-${VERSION}-windows-x64.exe.sha256)"
            echo ""
            echo "**Helm chart**: [${chart}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${chart})"
            echo "- [SHA-256 checksum](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${chart}.sha256)"
            echo ""
            echo "**Install channels**: Compose, Home Assistant, CasaOS, Cosmos, Umbrel, Unraid, and Helm deploy the GHCR image; the Proxmox LXC installer builds from source."
          } >> changelog-section.md

      - name: Create draft GitHub release with verified assets
        uses: step-security/action-gh-release@44319d37c8b7966bf07f89f0cbf63408141446df # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: QuestarrNG ${{ github.ref_name }}
          body_path: changelog-section.md
          draft: true
          files: release-assets/*

      - name: Verify draft release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          installer="QuestarrSetup-${VERSION}-windows-x64.exe"
          chart_version="$(sed -n 's/^version: *//p' charts/questarr/Chart.yaml | head -n 1 | tr -d '\"')"
          chart="questarr-${chart_version}.tgz"
          release_json="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets)"
          asset_check='.tagName == $tag and .isDraft and (.isPrerelease | not) and (([.assets[].name] | sort) == ([$installer, ($installer + ".sha256"), $chart, ($chart + ".sha256")] | sort))'
          jq -e --arg tag "$TAG" --arg installer "$installer" --arg chart "$chart" "$asset_check" <<<"$release_json" > /dev/null

      - name: Log in to GHCR after all release assets pass
        uses: step-security/docker-login-action@8c7b695d8738c5699a679ff5254baf0f19f20a94 # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx for release tag aliases
        uses: step-security/setup-buildx-action@e50058a0fcd8d1a7d626c905502d010a468bf238 # v4.4.1

      - name: Attach versioned GHCR tags after all release assets pass
        shell: bash
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          BUILD_DIGEST: ${{ needs.publish.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if [[ ! "$BUILD_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid release image digest: $BUILD_DIGEST" >&2
            exit 1
          fi
          for tag in "$VERSION" latest; do
            docker buildx imagetools create \
              --tag "${IMAGE}:${tag}" \
              "${IMAGE}@${BUILD_DIGEST}"
          done

      - name: Publish verified GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Verify published release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          installer="QuestarrSetup-${VERSION}-windows-x64.exe"
          chart_version="$(sed -n 's/^version: *//p' charts/questarr/Chart.yaml | head -n 1 | tr -d '\"')"
          chart="questarr-${chart_version}.tgz"
          asset_check='.tagName == $tag and (.isDraft | not) and (.isPrerelease | not) and (([.assets[].name] | sort) == ([$installer, ($installer + ".sha256"), $chart, ($chart + ".sha256")] | sort))'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets \
            | jq -e --arg tag "$TAG" --arg installer "$installer" --arg chart "$chart" "$asset_check" > /dev/null

  update-changelog:
    name: Open changelog update pull request
    needs: [release, publish]
    if: startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      IMAGE: ${{ needs.publish.outputs.image }}
      IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - name: Checkout release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          package-manager-cache: false

      - name: Open a changelog update pull request
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          branch="release/changelog-${TAG}"
          previous_tag="$(scripts/latest-published-release-tag.sh "$TAG")"
          release_sha="$(git rev-parse "${TAG}^{commit}")"
          release_date="$(git show -s --format=%cs "$release_sha")"
          git fetch origin main:refs/remotes/origin/main
          git checkout -B "$branch" origin/main
          if [[ "$IMAGE" != "ghcr.io/${GITHUB_REPOSITORY,,}" || ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo 'The published image reference or digest is invalid.' >&2
            exit 1
          fi
          python3 - "$IMAGE" "$VERSION" "$IMAGE_DIGEST" <<'PY'
          import re
          import sys
          from pathlib import Path

          image, version, digest = sys.argv[1:]
          if image != "ghcr.io/snapetech-org/questarrng":
              raise SystemExit("Unexpected Home Assistant base image repository")
          if not re.fullmatch(r"\d+\.\d+\.\d+", version) or not re.fullmatch(r"sha256:[a-f0-9]{64}", digest):
              raise SystemExit("Invalid release version or OCI digest")

          path = Path("questarr/Dockerfile")
          lines = path.read_text().splitlines()
          matches = [
              index for index, line in enumerate(lines)
              if re.fullmatch(r"ARG QUESTARR_IMAGE=ghcr\.io/snapetech-org/questarrng:\d+\.\d+\.\d+@sha256:[a-f0-9]{64}", line)
          ]
          if len(matches) != 1:
              raise SystemExit("Expected exactly one pinned Home Assistant base image")
          lines[matches[0]] = f"ARG QUESTARR_IMAGE={image}:{version}@{digest}"
          path.write_text("\n".join(lines) + "\n")
          PY
          node scripts/assemble-release-notes.mjs \
            --previous-tag "$previous_tag" \
            --head "$release_sha" \
            --version "$VERSION" \
            --date "$release_date" \
            --changelog docs/CHANGELOG.md \
            --output docs/CHANGELOG.md
          git add docs/CHANGELOG.md questarr/Dockerfile
          if git diff --cached --quiet; then
            echo 'The checked-in changelog already contains these release notes.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m "docs(changelog): sync release notes and Home Assistant image for ${TAG}" \
            -m 'release-note: none'
          git push --force origin "HEAD:refs/heads/${branch}"

          pr_url="$(gh pr list --base main --head "$branch" --state open --json url --jq '.[0].url // empty')"
          if [[ -z "$pr_url" ]]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "docs(changelog): sync release assets for ${TAG}" \
              --body "Automated follow-up for the published ${TAG} release. It syncs docs/CHANGELOG.md and the Home Assistant add-on's pinned base image to the released GHCR digest."
          else
            echo "Updated existing changelog pull request: ${pr_url}"
          fi

  finalize-release:
    if: github.repository_id == '1388297896' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.finalize_release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      packages: write
      security-events: read
      checks: read
      vulnerability-alerts: read
    outputs:
      release_sha: ${{ steps.validate.outputs.release_sha }}
      previous_tag: ${{ steps.validate.outputs.previous_tag }}
      release_date: ${{ steps.validate.outputs.release_date }}
      version: ${{ steps.validate.outputs.version }}
      source_run_id: ${{ steps.validate.outputs.source_run_id }}
      image: ${{ steps.validate.outputs.image }}
      release_image_digest: ${{ steps.validate.outputs.release_image_digest }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout current release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js 22.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - name: Validate the existing tag build and smoke evidence
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.finalize_release_tag }}
          ANNOUNCE_TAG: ${{ inputs.announce_release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tag must use vMAJOR.MINOR.PATCH.' >&2
            exit 1
          fi
          if [[ -n "$ANNOUNCE_TAG" && "$ANNOUNCE_TAG" != "$TAG" ]]; then
            echo 'The finalize and announce inputs must identify the same release tag.' >&2
            exit 1
          fi

          git fetch origin '+refs/heads/main:refs/remotes/origin/main' --tags
          release_sha="$(git rev-parse "${TAG}^{commit}")"
          git merge-base --is-ancestor "$release_sha" origin/main || {
            echo "Release tag $TAG is not on main."
            exit 1
          }
          git show "${release_sha}:package.json" > /tmp/release-package.json
          version="$(node -p "require('/tmp/release-package.json').version")"
          if [[ "$TAG" != "v$version" ]]; then
            echo "Release tag $TAG does not match package version $version."
            exit 1
          fi
          release_date="$(git show -s --format=%cs "$release_sha")"

          if ! git diff --quiet "$release_sha" origin/main -- release-notes; then
            echo 'Release-note fragments changed after the tagged source; refusing to assemble notes from a different source.' >&2
            exit 1
          fi
          if release_status="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>&1)"; then
            echo "A GitHub release already exists for $TAG; refusing to replace it." >&2
            exit 1
          elif ! grep -Fq 'HTTP 404' <<< "$release_status"; then
            echo "$release_status" >&2
            exit 1
          fi

          previous_tag="$(scripts/latest-published-release-tag.sh "$TAG")"
          runs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${release_sha}&per_page=100")"
          run_id="$(jq -r --arg tag "$TAG" \
            '[.workflow_runs[] | select(.name == "Publish QuestarrNG image" and .event == "push" and .head_branch == $tag)] | sort_by(.run_number) | last | .id // empty' \
            <<< "$runs_json")"
          if [[ -z "$run_id" ]]; then
            echo "No prior tag workflow run found for $TAG at $release_sha." >&2
            exit 1
          fi
          jobs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100")"
          jq -e '
            any(.jobs[]; .name == "publish" and .conclusion == "success") and
            any(.jobs[]; .name == "addon-smoke" and .conclusion == "success") and
            any(.jobs[]; .name == "release" and .conclusion == "failure" and
              any(.steps[]; .name == "Add curated release-note fragments" and .conclusion == "failure"))
          ' <<< "$jobs_json" > /dev/null
          release_job_id="$(jq -r '[.jobs[] | select(.name == "release" and .conclusion == "failure") | .id][0] // empty' <<< "$jobs_json")"
          if [[ -z "$release_job_id" ]]; then
            echo "The previous $TAG run did not fail at the release-note step." >&2
            exit 1
          fi
          artifact_name="questarr-release-assets-${TAG}"
          artifacts_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
          jq -e --arg name "$artifact_name" \
            'any(.artifacts[]; .name == $name and (.expired | not))' \
            <<< "$artifacts_json" > /dev/null
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --job "$release_job_id" --log-failed > release-failure.log
          grep -Fq "Changelog is missing the section for version ${version}." release-failure.log || {
            echo "The previous $TAG release-note failure does not match the known missing-section error." >&2
            exit 1
          }

          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          package_api="orgs/${GITHUB_REPOSITORY_OWNER}/packages/container/questarrng/versions?per_page=100"
          image_digest="$(gh api --paginate "$package_api" \
            --jq ".[] | select((.metadata.container.tags // []) | index(\"${version}\")) | .name" \
            | tail -n 1)"
          if [[ ! "$image_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Could not resolve the immutable GHCR digest for $TAG." >&2
            exit 1
          fi

          {
            echo "release_sha=$release_sha"
            echo "previous_tag=$previous_tag"
            echo "release_date=$release_date"
            echo "version=$version"
            echo "source_run_id=$run_id"
            echo "image=$image"
            echo "release_image_digest=$image_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: step-security/docker-login-action@8c7b695d8738c5699a679ff5254baf0f19f20a94 # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: step-security/setup-buildx-action@e50058a0fcd8d1a7d626c905502d010a468bf238 # v4.4.1

      - name: Verify the published release image
        id: verify-image
        shell: bash
        env:
          RELEASE_SHA: ${{ steps.validate.outputs.release_sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools inspect --raw "${image}:sha-${RELEASE_SHA}" > source-image.json
          jq -e '
            [.manifests[] | select(.platform.os != null and .platform.os != "unknown") |
              "\(.platform.os)/\(.platform.architecture)"] | sort == ["linux/amd64", "linux/arm64"]
          ' source-image.json > /dev/null

          amd64_digest="$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' source-image.json)"
          arm64_digest="$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' source-image.json)"
          if [[ ! "$amd64_digest" =~ ^sha256:[a-f0-9]{64}$ || ! "$arm64_digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Could not resolve valid release image digests: amd64=$amd64_digest arm64=$arm64_digest" >&2
            exit 1
          fi
          {
            echo "amd64_image=${image}@${amd64_digest}"
            echo "arm64_image=${image}@${arm64_digest}"
          } >> "$GITHUB_OUTPUT"

      - name: Rescan the verified linux/amd64 release image with current Trivy database
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_VEX: security/vex/questarr.openvex.json
        with:
          image-ref: ${{ steps.verify-image.outputs.amd64_image }}
          format: table
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          scanners: "vuln"
          exit-code: "1"
          cache: "false"

      - name: Rescan the verified linux/arm64 release image with current Trivy database
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_VEX: security/vex/questarr.openvex.json
        with:
          image-ref: ${{ steps.verify-image.outputs.arm64_image }}
          format: table
          severity: "UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL"
          scanners: "vuln"
          exit-code: "1"
          cache: "false"

      - name: Require clean security findings and completed source scans
        env:
          GH_TOKEN: ${{ secrets.SECURITY_READ_TOKEN || github.token }}
          RELEASE_SHA: ${{ steps.validate.outputs.release_sha }}
          RELEASE_REF: refs/tags/${{ inputs.finalize_release_tag }}
        run: node scripts/check-release-security.mjs

      - name: Download verified Windows assets from the failed release run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: questarr-release-assets-${{ inputs.finalize_release_tag }}
          run-id: ${{ steps.validate.outputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-assets

      - name: Verify recovered release asset inventory and checksums
        shell: bash
        env:
          TAG: ${{ inputs.finalize_release_tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          installer="QuestarrSetup-${VERSION}-windows-x64.exe"
          shopt -s nullglob
          charts=(release-assets/questarr-*.tgz)
          if [[ ${#charts[@]} -ne 1 ]]; then
            echo "Expected one packaged Helm chart, found ${#charts[@]}." >&2
            exit 1
          fi
          chart="${charts[0]##*/}"
          expected=("$installer" "$installer.sha256" "$chart" "$chart.sha256")
          mapfile -t actual < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(printf '%s\n' "${actual[@]}")
          (cd release-assets && sha256sum -c "$installer.sha256" && sha256sum -c "$chart.sha256")
          chart_metadata="$(helm show chart "release-assets/$chart")"
          grep -Fxq "appVersion: $VERSION" <<< "$chart_metadata"

      - name: Assemble release body
        shell: bash
        env:
          TAG: ${{ inputs.finalize_release_tag }}
          VERSION: ${{ steps.validate.outputs.version }}
          RELEASE_SHA: ${{ steps.validate.outputs.release_sha }}
          PREVIOUS_TAG: ${{ steps.validate.outputs.previous_tag }}
          RELEASE_DATE: ${{ steps.validate.outputs.release_date }}
        run: |
          set -euo pipefail
          node scripts/assemble-release-notes.mjs \
            --previous-tag "$PREVIOUS_TAG" \
            --head "$RELEASE_SHA" \
            --version "$VERSION" \
            --date "$RELEASE_DATE" \
            --changelog docs/CHANGELOG.md \
            --output docs/CHANGELOG.md
          node scripts/extract-changelog.mjs "$VERSION" > release-body.md
          if ! grep -Eq '^[[:space:]]*-[[:space:]]+' release-body.md; then
            echo 'Generated release notes contain no changelog entries.' >&2
            exit 1
          fi
          chart="$(find release-assets -maxdepth 1 -type f -name 'questarr-*.tgz' -printf '%f\n')"
          if [[ -z "$chart" ]]; then
            echo 'Missing packaged Helm chart from the original tag build.' >&2
            exit 1
          fi
          {
            echo ""
            echo "**Container image**: \`ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}\`"
            echo "- [GitHub Container Registry](https://github.com/orgs/snapetech-org/packages/container/package/questarrng)"
            echo ""
            echo "Pull with: \`docker pull ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}\`."
            echo ""
            echo "**Windows installer**: [QuestarrSetup-${VERSION}-windows-x64.exe](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/QuestarrSetup-${VERSION}-windows-x64.exe)"
            echo "- [SHA-256 checksum](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/QuestarrSetup-${VERSION}-windows-x64.exe.sha256)"
            echo ""
            echo "**Helm chart**: [${chart}](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${chart})"
            echo "- [SHA-256 checksum](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${chart}.sha256)"
          } >> release-body.md

      - name: Create recovered draft GitHub release with verified assets
        uses: step-security/action-gh-release@44319d37c8b7966bf07f89f0cbf63408141446df # v3.0.3
        with:
          tag_name: ${{ inputs.finalize_release_tag }}
          name: QuestarrNG ${{ inputs.finalize_release_tag }}
          body_path: release-body.md
          draft: true
          files: release-assets/*

      - name: Verify recovered draft assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.finalize_release_tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          installer="QuestarrSetup-${VERSION}-windows-x64.exe"
          chart="$(find release-assets -maxdepth 1 -type f -name 'questarr-*.tgz' -printf '%f\n')"
          release_json="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,body,assets)"
          asset_check='.tagName == $tag and .isDraft and (.isPrerelease | not) and (.body | type == "string" and length > 0) and (([.assets[].name] | sort) == ([$installer, ($installer + ".sha256"), $chart, ($chart + ".sha256")] | sort))'
          jq -e --arg tag "$TAG" --arg installer "$installer" --arg chart "$chart" "$asset_check" <<<"$release_json" > /dev/null

      - name: Attach versioned GHCR tags after recovered assets pass
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/questarrng
          RELEASE_SHA: ${{ steps.validate.outputs.release_sha }}
          VERSION: ${{ steps.validate.outputs.version }}
        run: |
          set -euo pipefail
          for tag in "$VERSION" latest; do
            docker buildx imagetools create \
              --tag "${IMAGE}:${tag}" \
              "${IMAGE}:sha-${RELEASE_SHA}"
          done

      - name: Publish recovered GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.finalize_release_tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Verify recovered release publication
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.finalize_release_tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          installer="QuestarrSetup-${VERSION}-windows-x64.exe"
          chart="$(find release-assets -maxdepth 1 -type f -name 'questarr-*.tgz' -printf '%f\n')"
          release_json="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,body,assets)"
          asset_check='.tagName == $tag and (.isDraft | not) and (.isPrerelease | not) and (.body | type == "string" and length > 0) and (([.assets[].name] | sort) == ([$installer, ($installer + ".sha256"), $chart, ($chart + ".sha256")] | sort))'
          jq -e --arg tag "$TAG" --arg installer "$installer" --arg chart "$chart" "$asset_check" <<<"$release_json" > /dev/null

  update-finalized-changelog:
    if: github.repository_id == '1388297896' && github.event_name == 'workflow_dispatch' && inputs.finalize_release_tag != '' && needs['finalize-release'].result == 'success'
    needs: [finalize-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.finalize_release_tag }}
      RELEASE_SHA: ${{ needs['finalize-release'].outputs.release_sha }}
      PREVIOUS_TAG: ${{ needs['finalize-release'].outputs.previous_tag }}
      RELEASE_DATE: ${{ needs['finalize-release'].outputs.release_date }}
      VERSION: ${{ needs['finalize-release'].outputs.version }}
      IMAGE: ${{ needs['finalize-release'].outputs.image }}
      IMAGE_DIGEST: ${{ needs['finalize-release'].outputs.release_image_digest }}
    steps:
      - name: Checkout current release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js 22.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      - name: Open changelog update pull request
        shell: bash
        run: |
          set -euo pipefail
          branch="release/changelog-${TAG}"
          git fetch origin '+refs/heads/main:refs/remotes/origin/main' --tags
          if ! git diff --quiet "$RELEASE_SHA" origin/main -- release-notes; then
            echo 'Release-note fragments changed after the tagged source; refusing to assemble a mismatched changelog.' >&2
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/${branch}" >/dev/null; then
            echo "Changelog branch ${branch} already exists; inspect it before updating the release history." >&2
            exit 1
          fi
          git checkout -b "$branch" origin/main
          version="${TAG#v}"
          if [[ "$IMAGE" != "ghcr.io/${GITHUB_REPOSITORY,,}" || ! "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo 'The published image reference or digest is invalid.' >&2
            exit 1
          fi
          python3 - "$IMAGE" "$version" "$IMAGE_DIGEST" <<'PY'
          import re
          import sys
          from pathlib import Path

          image, version, digest = sys.argv[1:]
          if image != "ghcr.io/snapetech-org/questarrng":
              raise SystemExit("Unexpected Home Assistant base image repository")
          if not re.fullmatch(r"\d+\.\d+\.\d+", version) or not re.fullmatch(r"sha256:[a-f0-9]{64}", digest):
              raise SystemExit("Invalid release version or OCI digest")

          path = Path("questarr/Dockerfile")
          lines = path.read_text().splitlines()
          matches = [
              index for index, line in enumerate(lines)
              if re.fullmatch(r"ARG QUESTARR_IMAGE=ghcr\.io/snapetech-org/questarrng:\d+\.\d+\.\d+@sha256:[a-f0-9]{64}", line)
          ]
          if len(matches) != 1:
              raise SystemExit("Expected exactly one pinned Home Assistant base image")
          lines[matches[0]] = f"ARG QUESTARR_IMAGE={image}:{version}@{digest}"
          path.write_text("\n".join(lines) + "\n")
          PY
          node scripts/assemble-release-notes.mjs \
            --previous-tag "$PREVIOUS_TAG" \
            --head "$RELEASE_SHA" \
            --version "$VERSION" \
            --date "$RELEASE_DATE" \
            --changelog docs/CHANGELOG.md \
            --output docs/CHANGELOG.md
          git add docs/CHANGELOG.md questarr/Dockerfile
          if git diff --cached --quiet; then
            echo 'The checked-in changelog already contains these release notes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m "docs(changelog): sync release notes and Home Assistant image for ${TAG}" \
            -m 'release-note: none'
          git push origin "HEAD:refs/heads/${branch}"
          gh pr create \
            --base main \
            --head "$branch" \
              --title "docs(changelog): sync release assets for ${TAG}" \
              --body "Automated follow-up for the published ${TAG} release. It syncs docs/CHANGELOG.md and the Home Assistant add-on's pinned base image to the released GHCR digest."

  announce-release:
    name: Announce release to Discord
    needs: [release, finalize-release]
    if: ${{ always() && github.repository_id == '1388297896' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && ((inputs.finalize_release_tag == '' && inputs.announce_release_tag != '') || (inputs.finalize_release_tag != '' && needs['finalize-release'].result == 'success')) }}
    runs-on: ubuntu-latest
    environment:
      name: discord-release
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      TAG: ${{ inputs.finalize_release_tag || inputs.announce_release_tag || github.ref_name }}
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          package-manager-cache: false

      - name: Send release announcement
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release announcement tag must use vMAJOR.MINOR.PATCH.' >&2
            exit 1
          fi
          test -n "$DISCORD_WEBHOOK" || {
            echo 'DISCORD_WEBHOOK is required in the discord-release environment.' >&2
            exit 1
          }

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json body,isDraft,isPrerelease,tagName,url > release.json
          jq -e --arg tag "$TAG" \
            '.tagName == $tag and .isDraft == false and .isPrerelease == false and (.body | type == "string" and length > 0)' \
            release.json > /dev/null
          version="${TAG#v}"
          printf '%s' "$(jq -r '.body' release.json)" \
            | node scripts/discord-release-notes.mjs --split > chunks.json
          chunk_count="$(jq 'length' chunks.json)"
          (( chunk_count > 0 )) || {
            echo 'The published release notes are empty.' >&2
            exit 1
          }

          webhook_url="$DISCORD_WEBHOOK"
          if [[ "$webhook_url" == *'?'* ]]; then
            webhook_url+='&wait=true'
          else
            webhook_url+='?wait=true'
          fi

          for ((index = 0; index < chunk_count; index += 1)); do
            description="$(jq -r --argjson index "$index" '.[$index]' chunks.json)"
            number=$((index + 1))
            title="QuestarrNG ${TAG} release notes (${number}/${chunk_count})"
            jq -n \
              --arg username 'QuestarrNG Releases' \
              --arg title "$title" \
              --arg url "$(jq -r '.url' release.json)" \
              --arg description "$description" \
              --arg image "ghcr.io/${GITHUB_REPOSITORY,,}:${version}" \
              --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              --argjson first "$index" \
              '{
                username: $username,
                embeds: [{
                  title: $title,
                  url: $url,
                  description: $description,
                  color: 5814783,
                  fields: (if $first == 0 then [
                    { name: "Image", value: $image, inline: false },
                    { name: "Workflow", value: $run_url, inline: false }
                  ] else [] end)
                }]
              }' > payload.json

            http_status="$(curl --fail --silent --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              -H 'Content-Type: application/json' \
              -X POST \
              --data @payload.json \
              "$webhook_url")"
            if [[ ! "$http_status" =~ ^2[0-9]{2}$ ]]; then
              echo "Discord webhook returned unexpected HTTP status $http_status." >&2
              exit 1
            fi
            if (( number < chunk_count )); then
              sleep 1
            fi
          done
